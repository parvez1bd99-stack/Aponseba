<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - ডিজিটাল কার্ড স্ক্যানার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; }
        /* স্ক্যানার ইউআই সুন্দর করা */
        #reader { border: none !important; }
        #reader__dashboard_section_csr button {
            background-color: #0d9488 !important;
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 8px !important;
            font-size: 12px !important;
            text-transform: uppercase !important;
            font-weight: bold !important;
            border: none;
            cursor: pointer;
        }
        #reader video {
            border-radius: 1.5rem !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 text-white">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-black italic text-teal-400 uppercase tracking-tighter">আপন</h1>
        <p class="text-xs text-gray-400 uppercase tracking-widest mt-2">মেম্বার কার্ড স্ক্যান করুন</p>
    </div>

    <!-- স্ক্যানার কন্টেইনার -->
    <div class="w-full max-w-sm bg-white rounded-[2.5rem] overflow-hidden shadow-2xl p-4">
        
        <!-- ক্যামেরা ভিউ এরিয়া -->
        <div id="reader" class="w-full"></div>

        <!-- গ্যালারি থেকে সিলেক্ট করার জন্য আলাদা ইনপুট -->
        <div class="mt-4 p-4 border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400 uppercase font-black mb-2">অথবা ফাইল থেকে ছবি নিন</p>
            <input type="file" id="qr-input-file" accept="image/*" class="text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
        </div>
    </div>

    <div class="mt-10 text-center">
        <p id="status" class="text-xs text-teal-500 font-bold mb-4 uppercase animate-pulse">ক্যামেরা খোঁজা হচ্ছে...</p>
        <a href="index.html" class="text-gray-500 underline text-[10px] font-bold uppercase tracking-widest">ফিরে যান</a>
    </div>

    <script>
        const SECRET_KEY = "APON-SECURE-V1";

        // স্ক্যান সফল হলে যা হবে
        function onScanSuccess(decodedText) {
            try {
                const decryptedData = atob(decodedText); 
                const parts = decryptedData.split(":");

                if (parts[0] === SECRET_KEY) {
                    const memberId = parts[1];
                    // প্রোফাইলে রিডাইরেক্ট
                    window.location.href = `scan-view.html?id=${memberId}`;
                } else {
                    alert("ভুল কোড! এটি সঠিক মেম্বার কার্ড নয়।");
                }
            } catch (e) {
                alert("অচেনা কিউআর কোড! সঠিক কার্ড স্ক্যান করুন।");
            }
        }

        // ক্যামেরা স্ক্যানার কনফিগারেশন (ব্যাক ক্যামেরা প্রায়োরিটি)
        const config = { 
            fps: 15, 
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: false, // ডিফল্ট ক্যামেরা হিসেবে ব্যাক ক্যামেরা পেতে এটি false রাখা ভালো
            aspectRatio: 1.0,
            videoConstraints: {
                facingMode: "environment" // এটি ব্যাক ক্যামেরা নিশ্চিত করবে
            }
        };

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
        html5QrcodeScanner.render(onScanSuccess);

        // ফাইল/গ্যালারি থেকে স্ক্যান করার লজিক
        const fileInput = document.getElementById('qr-input-file');
        fileInput.addEventListener('change', e => {
            if (e.target.files.length == 0) return;

            const imageFile = e.target.files[0];
            const html5QrCode = new Html5Qrcode("reader");
            
            document.getElementById('status').innerText = "ছবি প্রসেসিং হচ্ছে...";

            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    onScanSuccess(decodedText);
                })
                .catch(err => {
                    alert("এই ছবিতে কোনো কিউআর কোড পাওয়া যায়নি!");
                    document.getElementById('status').innerText = "আবার চেষ্টা করুন";
                });
        });

        // স্ট্যাটাস আপডেট
        setTimeout(() => {
            document.getElementById('status').innerText = "স্ক্যান করার জন্য প্রস্তুত";
        }, 3000);
    </script>
</body>
</html>
