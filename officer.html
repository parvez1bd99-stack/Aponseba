<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>অফিসার প্যানেল - লোন আবেদন</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
    input, select, textarea { font-size: 16px; } /* আইফোনে ফোকাস করলে জুম হওয়া বন্ধ */
    button, a.btn { touch-action: manipulation; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (max-width: 767px) {
      .rtable thead { display: none; }
      .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
      .rtable tr { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
      .rtable td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0 !important; text-align: right; }
      .rtable td::before { content: attr(data-label); color: #6b7280; font-size: 12px; text-align: left; flex-shrink: 0; }
      .rtable td.title { display: block; text-align: left; font-size: 17px; font-weight: 700; padding-bottom: 9px !important; margin-bottom: 4px; border-bottom: 1px dashed #e5e7eb; }
      .rtable td.title::before, .rtable td.act::before, .rtable td.full::before { display: none; }
      .rtable td.act { display: block; padding-top: 10px !important; }
      .rtable td.act > * { width: 100%; text-align: center; }
      .rtable td.full { display: block; text-align: center; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-[100dvh]">

  <!-- নেভিগেশন বার -->
  <nav class="bg-white shadow-sm border-b sticky top-0 z-40" style="padding-top: env(safe-area-inset-top)">
    <div class="px-4 py-3 flex justify-between items-center gap-3">
      <div class="min-w-0">
        <h1 class="text-lg sm:text-xl font-bold text-gray-800 truncate">অফিসার ড্যাশবোর্ড</h1>
        <p class="text-xs text-gray-500 truncate">স্বাগতম, <span id="officerName" class="font-semibold text-emerald-600">...</span></p>
      </div>
      <button id="logoutBtn" class="shrink-0 text-sm bg-rose-50 active:bg-rose-200 hover:bg-rose-100 text-rose-600 px-4 py-2.5 rounded-xl font-medium transition">
        লগআউট
      </button>
    </div>
    <div class="px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
      <a href="collection.html" class="shrink-0 text-sm bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2.5 rounded-xl font-medium transition">
        কিস্তি আদায় পেজ →
      </a>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto p-3 sm:p-4 md:p-6 space-y-4 md:space-y-6">

    <!-- লোন আবেদন ফর্ম -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 md:p-6">
      <h2 class="text-base md:text-lg font-bold text-gray-800 mb-4 pb-2 border-b">নতুন লোন আবেদন তৈরি করুন</h2>
      
      <form id="loanForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="custName" class="block text-xs font-semibold text-gray-600 mb-1">কাস্টমারের নাম</label>
            <input type="text" id="custName" required placeholder="যেমন: রহিম উদ্দিন" autocomplete="name"
                   class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label for="custPhone" class="block text-xs font-semibold text-gray-600 mb-1">মোবাইল নম্বর</label>
            <input type="tel" id="custPhone" required placeholder="017XXXXXXXX" inputmode="tel" autocomplete="tel"
                   class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label for="custNid" class="block text-xs font-semibold text-gray-600 mb-1">জাতীয় পরিচয়পত্র (NID)</label>
            <input type="text" id="custNid" required placeholder="১০ বা ১৭ ডিজিটের NID" inputmode="numeric"
                   class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <div class="col-span-2 md:col-span-1">
            <label for="principal" class="block text-xs font-semibold text-gray-600 mb-1">লোনের পরিমাণ (টাকা)</label>
            <input type="number" id="principal" required min="1000" placeholder="যেমন: 20000" inputmode="numeric"
                   class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none font-semibold text-gray-800">
          </div>
          <div>
            <label for="installments" class="block text-xs font-semibold text-gray-600 mb-1">কিস্তি সংখ্যা</label>
            <input type="number" id="installments" required min="1" placeholder="যেমন: 15" inputmode="numeric"
                   class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none font-semibold text-gray-800">
          </div>
          <div>
            <label for="frequency" class="block text-xs font-semibold text-gray-600 mb-1">কিস্তির ধরন</label>
            <select id="frequency" class="w-full border rounded-xl px-3 py-3 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="daily">দৈনিক কিস্তি</option>
              <option value="weekly" selected>সাপ্তাহিক কিস্তি</option>
              <option value="monthly">মাসিক কিস্তি</option>
            </select>
          </div>
        </div>

        <div>
          <label for="admissionDeposit" class="block text-xs font-semibold text-gray-600 mb-1">ভর্তি জমা (টাকা) — ফেরতযোগ্য</label>
          <input type="number" id="admissionDeposit" min="0" placeholder="যেমন: 400" inputmode="numeric"
                 class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none font-semibold text-gray-800">
          <p id="depositHint" class="text-xs text-gray-400 mt-1">লোনের পরিমাণ লিখলে ১% ও ২% এর হিসাব এখানে দেখাবে</p>
        </div>

        <div>
          <label for="address" class="block text-xs font-semibold text-gray-600 mb-1">গ্রাহকের ঠিকানা ও বিবরণ</label>
          <input type="text" id="address" placeholder="গ্রাম/মহল্লা, থানা, জেলা" autocomplete="street-address"
                 class="w-full border rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">গ্রাহকের ছবি</label>
          <div class="flex items-center gap-3">
            <div id="photoPreview" class="w-20 h-20 rounded-2xl bg-gray-100 border flex items-center justify-center text-gray-400 text-2xl overflow-hidden shrink-0">📷</div>
            <div class="flex-1">
              <input type="file" id="custPhoto" accept="image/*" class="hidden">
              <button type="button" id="photoBtn" class="w-full border border-emerald-600 text-emerald-700 font-semibold py-3 rounded-xl active:bg-emerald-50">ছবি তুলুন / বাছাই করুন</button>
              <p id="photoInfo" class="text-xs text-gray-400 mt-1">ছবি নিজে থেকেই ছোট করে সেভ হবে</p>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" 
                class="w-full bg-emerald-600 active:bg-emerald-800 hover:bg-emerald-700 text-white font-semibold text-base py-3.5 rounded-xl shadow transition disabled:opacity-60">
          মালিকের অনুমোদনের জন্য পাঠান
        </button>
      </form>
    </div>

    <!-- লোন আবেদনের তালিকা -->
    <div class="md:bg-white md:rounded-2xl md:shadow-sm md:border md:border-gray-200 md:p-6">
      <h3 class="text-base font-bold text-gray-800 mb-3 px-1 md:px-0">আপনার পাঠানো লোন আবেদনসমূহ</h3>
      <table class="rtable w-full text-left text-sm">
        <thead class="bg-gray-50 text-gray-600 border-b">
          <tr>
            <th class="p-3">গ্রাহকের নাম</th>
            <th class="p-3">মোবাইল</th>
            <th class="p-3">টাকার পরিমাণ</th>
            <th class="p-3">কিস্তি</th>
            <th class="p-3">স্ট্যাটাস</th>
            <th class="p-3">পাসবুক</th>
          </tr>
        </thead>
        <tbody id="applicationTable" class="md:divide-y md:divide-gray-100">
          <tr>
            <td colspan="6" class="full p-4 text-center text-gray-400">ডাটা লোড হচ্ছে...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script type="module">
    import { db, checkAccess, handleLogout, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "./firebase-config.js";

    checkAccess(); // লগইন নিশ্চিত করা

    document.getElementById("officerName").innerText = localStorage.getItem("userName") || "অফিসার";
    document.getElementById("logoutBtn").addEventListener("click", handleLogout);

    const officerUid = localStorage.getItem("userUid");

    // ---- ভর্তি জমার ১%-২% হিসাব (শুধু সহায়তা; আসল টাকা অফিসার নিজে লিখবেন) ----
    function updateDepositHint() {
      const p = Number(document.getElementById("principal").value) || 0;
      const hint = document.getElementById("depositHint");
      if (p > 0) {
        hint.innerText = `১% = ${Math.round(p * 0.01).toLocaleString('bn-BD')} ৳ | ২% = ${Math.round(p * 0.02).toLocaleString('bn-BD')} ৳`;
      } else {
        hint.innerText = "লোনের পরিমাণ লিখলে ১% ও ২% এর হিসাব এখানে দেখাবে";
      }
    }
    document.getElementById("principal").addEventListener("input", updateDepositHint);

    // ---- গ্রাহকের ছবি: ফোনেই ছোট (কমপ্রেস) করে base64 হিসেবে সেভ হবে ----
    let photoData = "";
    const photoInput = document.getElementById("custPhoto");
    const photoPreview = document.getElementById("photoPreview");
    const photoInfo = document.getElementById("photoInfo");

    function compressImage(file, maxSize = 320, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("ছবি পড়া যায়নি")); };
        img.src = url;
      });
    }

    function resetPhoto() {
      photoData = "";
      photoInput.value = "";
      photoPreview.innerHTML = "📷";
      photoInfo.innerText = "ছবি নিজে থেকেই ছোট করে সেভ হবে";
    }

    document.getElementById("photoBtn").addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0];
      if (!file) return;
      try {
        photoData = await compressImage(file);
        photoPreview.innerHTML = `<img src="${photoData}" alt="গ্রাহকের ছবি" class="w-full h-full object-cover">`;
        photoInfo.innerText = `ছবি প্রস্তুত (${Math.round(photoData.length * 0.75 / 1024)} KB)`;
      } catch (err) {
        resetPhoto();
        alert("ছবিটি পড়া যায়নি, আবার চেষ্টা করুন।");
      }
    });

    // আবেদন ফর্ম সাবমিট
    document.getElementById("loanForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "পাঠানো হচ্ছে...";

      const newLoan = {
        name: document.getElementById("custName").value.trim(),
        phone: document.getElementById("custPhone").value.trim(),
        nid: document.getElementById("custNid").value.trim(),
        address: document.getElementById("address").value.trim(),
        photo: photoData,
        admissionDeposit: Number(document.getElementById("admissionDeposit").value) || 0,
        principal: Number(document.getElementById("principal").value),
        installments: Number(document.getElementById("installments").value),
        frequency: document.getElementById("frequency").value,
        interestRate: 0,
        totalPayable: 0,
        perInstallment: 0,
        paidAmount: 0,
        remainingAmount: 0,
        status: "pending", // মালিকের অপেক্ষায়
        appliedByUid: officerUid,
        appliedByName: localStorage.getItem("userName") || "Officer",
        branchId: localStorage.getItem("branchId") || "main",
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "loans"), newLoan);
        alert("লোন আবেদনটি মালিকের নিকট পাঠানো হয়েছে!");
        document.getElementById("loanForm").reset();
        resetPhoto();
        updateDepositHint();
      } catch (err) {
        console.error(err);
        alert("আবেদন জমা দিতে সমস্যা হয়েছে।");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "মালিকের অনুমোদনের জন্য পাঠান";
      }
    });

    // অফিসারের নিজের পাঠানো আবেদনের তালিকা দেখানো
    const q = query(collection(db, "loans"), where("appliedByUid", "==", officerUid));
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById("applicationTable");
      tbody.innerHTML = "";

      if (snapshot.empty) {
        tbody.innerHTML = `<tr><td colspan="6" class="full p-4 text-center text-gray-400">এখনো কোনো আবেদন জমা দেননি।</td></tr>`;
        return;
      }

      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;

        let badge = `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">অপেক্ষমাণ</span>`;
        if (item.status === 'active') badge = `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold">অনুমোদিত</span>`;
        if (item.status === 'completed') badge = `<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold">পরিশোধিত</span>`;
        if (item.status === 'rejected') badge = `<span class="bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-semibold">বাতিল</span>`;

        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="title p-3 font-medium text-gray-800">
            <div class="flex items-center gap-3">
              ${item.photo ? `<img src="${item.photo}" alt="" class="w-10 h-10 rounded-full object-cover border shrink-0">` : ``}
              <span>${item.name}</span>
            </div>
          </td>
          <td data-label="মোবাইল" class="p-3 text-gray-600">${item.phone}</td>
          <td data-label="টাকার পরিমাণ" class="p-3 font-semibold text-gray-700">${item.principal} ৳</td>
          <td data-label="কিস্তি" class="p-3 text-gray-600">${item.installments} টি</td>
          <td data-label="স্ট্যাটাস" class="p-3">${badge}</td>
          <td class="act p-3">
            ${item.status === 'active' || item.status === 'completed' 
              ? `<div class="flex gap-2 md:gap-3">
                  <a href="card.html?id=${id}" target="_blank" class="flex-1 md:flex-none inline-block bg-emerald-600 md:bg-transparent text-white md:text-emerald-600 md:hover:underline font-semibold md:font-medium text-sm md:text-xs py-2.5 md:py-0 rounded-xl">আইডি কার্ড ↗</a>
                  <a href="passbook.html?id=${id}" target="_blank" class="flex-1 md:flex-none inline-block bg-emerald-50 md:bg-transparent text-emerald-700 md:text-emerald-600 md:hover:underline font-semibold md:font-medium text-sm md:text-xs py-2.5 md:py-0 rounded-xl">পাসবুক ↗</a>
                </div>` 
              : `<span class="text-gray-400 text-xs">অনুমোদন প্রয়োজন</span>`}
          </td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
