<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - ইউজার কন্ট্রোল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-indigo-800 p-8 text-white text-center relative">
            <h2 class="text-3xl font-black italic tracking-tighter">আপন</h2>
            <p class="text-[10px] uppercase tracking-widest opacity-80 font-bold mt-1">নতুন স্টাফ ও মেম্বার একাউন্ট তৈরি</p>
            <button onclick="goBack()" class="absolute top-4 left-4 bg-indigo-700 p-2 rounded-full hover:bg-indigo-600 transition">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
        </div>

        <form id="userForm" class="p-8 space-y-5">
            <!-- ব্যক্তিগত তথ্য -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">পুরো নাম</label>
                    <input type="text" id="uName" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 text-sm shadow-sm" placeholder="ইউজারের নাম" required>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">ইমেল (লগইন আইডি)</label>
                    <input type="email" id="uEmail" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 text-sm shadow-sm" placeholder="example@mail.com" required>
                </div>
            </div>

            <!-- পাসওয়ার্ড -->
            <div class="space-y-1">
                <label class="text-[10px] font-black text-gray-400 uppercase ml-1">পাসওয়ার্ড (কমপক্ষে ৬ ডিজিট)</label>
                <input type="password" id="uPass" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 text-sm shadow-sm" placeholder="******" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- পদবী সিলেকশন -->
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">ইউজার পদবী (Role)</label>
                    <select id="uRole" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 text-sm shadow-sm bg-white font-bold" required>
                        <!-- লজিক দিয়ে অপশন লোড হবে -->
                    </select>
                </div>

                <!-- শাখা সিলেকশন -->
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-gray-400 uppercase ml-1">শাখা (Branch)</label>
                    <select id="uBranch" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 text-sm shadow-sm bg-white font-bold" required>
                        <option value="">লোডিং শাখা...</option>
                    </select>
                </div>
            </div>

            <div class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-lg text-[10px] text-amber-800 italic">
                * মনে রাখবেন: নতুন একাউন্ট তৈরির সাথে সাথে নিরাপত্তার খাতিরে আপনি অটোমেটিক লগআউট হয়ে যাবেন। আপনাকে পুনরায় লগইন করতে হবে।
            </div>

            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black hover:bg-indigo-700 shadow-xl transition-all transform active:scale-95 uppercase tracking-widest text-sm">নতুন ইউজার তৈরি করুন</button>
            </div>
            
            <p id="msg" class="text-center text-xs font-bold transition-all"></p>
        </form>
    </div>

    <script type="module">
        import { db, auth, handleLogout } from './firebase-config.js';
        import { collection, doc, setDoc, getDocs, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const loggedInRole = localStorage.getItem('userRole');
        const loggedInBranch = localStorage.getItem('branchId');

        // ১. পদবী ও শাখা অনুযায়ী UI সেটআপ
        async function setupForm() {
            const roleSelect = document.getElementById('uRole');
            const branchSelect = document.getElementById('uBranch');

            if (loggedInRole === 'owner') {
                // মালিক সব ধরণের রোল তৈরি করতে পারে
                roleSelect.innerHTML = `
                    <option value="customer">সদস্য (Customer)</option>
                    <option value="officer">লোন অফিসার (Officer)</option>
                    <option value="manager">ম্যানেজার (Manager)</option>
                `;
                // সব শাখা লোড
                const bSnap = await getDocs(collection(db, "branches"));
                branchSelect.innerHTML = '<option value="">শাখা সিলেক্ট করুন</option>';
                bSnap.forEach(d => {
                    branchSelect.innerHTML += `<option value="${d.id}">${d.data().branchName}</option>`;
                });
            } else if (loggedInRole === 'manager') {
                // ম্যানেজার শুধু অফিসার ও মেম্বার তৈরি করতে পারে
                roleSelect.innerHTML = `
                    <option value="customer">সদস্য (Customer)</option>
                    <option value="officer">লোন অফিসার (Officer)</option>
                `;
                // শাখা লক করা
                const bDoc = await getDoc(doc(db, "branches", loggedInBranch));
                branchSelect.innerHTML = `<option value="${loggedInBranch}">${bDoc.data().branchName}</option>`;
                branchSelect.disabled = true;
            }
        }

        // ২. ফরম সাবমিট লজিক
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            const name = document.getElementById('uName').value;
            const email = document.getElementById('uEmail').value;
            const pass = document.getElementById('uPass').value;
            const role = document.getElementById('uRole').value;
            const branch = document.getElementById('uBranch').value;

            if(!branch) return alert("দয়া করে শাখা নির্বাচন করুন!");
            if(pass.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ ডিজিট হতে হবে!");

            btn.disabled = true;
            btn.innerText = "প্রসেসিং হচ্ছে...";
            msg.innerText = "";

            try {
                // ২.১ নতুন ইউজার তৈরি (এটি বর্তমান এডমিনকে লগআউট করবে)
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                const newUser = userCred.user;
                
                // ২.২ ফায়ারস্টোরে প্রোফাইল ডাটা সেভ
                await setDoc(doc(db, "users", newUser.uid), {
                    name: name,
                    email: email,
                    role: role,
                    branchId: branch,
                    totalSavings: role === 'customer' ? 0 : null,
                    loanActive: role === 'customer' ? false : null,
                    createdAt: serverTimestamp(),
                    createdBy: localStorage.getItem('userName')
                });

                alert("একাউন্ট সফলভাবে তৈরি হয়েছে! নিরাপত্তার জন্য আপনাকে পুনরায় লগইন করতে হবে।");
                
                // ২.৩ লগআউট এবং রিডাইরেক্ট
                await signOut(auth);
                localStorage.clear();
                window.location.href = 'index.html';

            } catch (err) {
                msg.innerText = "ত্রুটি: " + err.message;
                msg.className = "text-center text-xs font-bold text-red-500 mt-2";
                btn.disabled = false;
                btn.innerText = "নতুন ইউজার তৈরি করুন";
            }
        });

        window.goBack = () => {
            if (loggedInRole === 'owner') window.location.href = 'owner-dashboard.html';
            else if (loggedInRole === 'manager') window.location.href = 'manager-dashboard.html';
        };

        setupForm();
    </script>
</body>
</html>
