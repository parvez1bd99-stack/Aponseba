<!-- START OF FILE owner-dashboard.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - মালিক ড্যাশবোর্ড</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0f2f5; }
        .stat-card { transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="pb-24">

    <!-- Top Navigation -->
    <nav class="bg-slate-900 text-white p-5 sticky top-0 z-50 shadow-2xl">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic text-emerald-400">আপন <span class="text-white text-xs font-normal not-italic ml-1">এডমিন প্যানেল</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p id="ownerName" class="text-sm font-bold">...</p>
                    <p class="text-[10px] text-emerald-400 uppercase tracking-widest">প্রধান পরিচালক</p>
                </div>
                <button onclick="logout()" class="bg-red-500/20 text-red-500 border border-red-500/50 px-3 py-1 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition">লগআউট</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        
        <!-- ১. কেন্দ্রীয় পরিসংখ্যান (Global Stats) -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stat-card bg-white p-5 rounded-3xl shadow-sm border-b-4 border-emerald-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মোট বিতরণ (গ্লোবাল)</p>
                <h3 id="globalDisbursed" class="text-xl font-black text-slate-800 mt-1">৳ ০</h3>
            </div>
            <div class="stat-card bg-white p-5 rounded-3xl shadow-sm border-b-4 border-blue-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মোট আদায়কৃত</p>
                <h3 id="globalCollected" class="text-xl font-black text-slate-800 mt-1">৳ ০</h3>
            </div>
            <div class="stat-card bg-white p-5 rounded-3xl shadow-sm border-b-4 border-red-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মার্কেট বকেয়া</p>
                <h3 id="globalOutstanding" class="text-xl font-black text-slate-800 mt-1">৳ ০</h3>
            </div>
            <div class="stat-card bg-white p-5 rounded-3xl shadow-sm border-b-4 border-amber-500">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মোট সঞ্চয় স্থিতি</p>
                <h3 id="globalSavings" class="text-xl font-black text-slate-800 mt-1">৳ ০</h3>
            </div>
        </div>

        <!-- ২. কুইক অ্যাকশন মেনু -->
        <div class="grid grid-cols-3 md:grid-cols-3 gap-4 mb-10">
            <a href="manage-branch.html" class="bg-emerald-600 p-6 rounded-3xl shadow-lg flex flex-col items-center justify-center text-white hover:bg-emerald-700 transition">
                <span class="text-3xl mb-2">🏢</span>
                <span class="text-xs font-bold">শাখা ও ম্যানেজার</span>
            </a>
            <a href="user-management.html" class="bg-slate-800 p-6 rounded-3xl shadow-lg flex flex-col items-center justify-center text-white hover:bg-slate-900 transition">
                <span class="text-3xl mb-2">👥</span>
                <span class="text-xs font-bold">স্টাফ কন্ট্রোল</span>
            </a>
            <a href="transaction-history.html" class="bg-blue-600 p-6 rounded-3xl shadow-lg flex flex-col items-center justify-center text-white hover:bg-blue-700 transition">
                <span class="text-3xl mb-2">📊</span>
                <span class="text-xs font-bold">গ্লোবাল রিপোর্ট</span>
            </a>
        </div>

        <!-- ৩. শাখা ভিত্তিক পারফরম্যান্স (Branch Summary) -->
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50/50">
                <h3 class="font-black text-slate-800 uppercase tracking-tight flex items-center gap-2">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full"></span>
                    শাখা সমূহের সংক্ষিপ্ত চিত্র
                </h3>
                <button onclick="loadOwnerDashboard()" class="text-xs text-blue-600 font-bold">রিফ্রেশ</button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 text-[10px] font-bold uppercase text-slate-400">
                            <th class="p-5">শাখার নাম</th>
                            <th class="p-5">বকেয়া লোন</th>
                            <th class="p-5">মোট সঞ্চয়</th>
                            <th class="p-5 text-center">অবস্থা</th>
                        </tr>
                    </thead>
                    <tbody id="branchPerformanceBody" class="divide-y divide-gray-100">
                        <tr><td colspan="4" class="p-10 text-center text-gray-400 italic">ডাটা লোড হচ্ছে...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ৪. বটম নেভিগেশন (মোবাইল বান্ধব) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-gray-200 flex justify-around p-4 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-50 md:hidden">
        <a href="owner-dashboard.html" class="flex flex-col items-center text-emerald-600">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">হোম</span>
        </a>
        <a href="manage-branch.html" class="flex flex-col items-center text-slate-400">
            <span class="text-xl">🏢</span>
            <span class="text-[10px] font-bold">শাখা</span>
        </a>
        <a href="user-management.html" class="flex flex-col items-center text-slate-400">
            <span class="text-xl">👥</span>
            <span class="text-[10px] font-bold">স্টাফ</span>
        </a>
        <button onclick="logout()" class="flex flex-col items-center text-slate-400">
            <span class="text-xl">🚪</span>
            <span class="text-[10px] font-bold">আউট</span>
        </button>
    </nav>

    <script type="module">
        import { db, checkAccess, handleLogout } from './firebase-config.js';
        import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('owner');
        window.logout = handleLogout;

        async function loadOwnerDashboard() {
            document.getElementById('ownerName').innerText = localStorage.getItem('userName');

            try {
                // ১. গ্লোবাল লোন ডাটা সংগ্রহ
                const loansSnap = await getDocs(collection(db, "loans"));
                let totalDis = 0, totalRem = 0;
                loansSnap.forEach(d => {
                    totalDis += Number(d.data().totalAmount || 0);
                    totalRem += Number(d.data().remainingAmount || 0);
                });

                // ২. গ্লোবাল সঞ্চয় ডাটা সংগ্রহ
                const usersSnap = await getDocs(query(collection(db, "users"), where("role", "==", "customer")));
                let totalSav = 0;
                usersSnap.forEach(d => totalSav += Number(d.data().totalSavings || 0));

                // UI Update
                document.getElementById('globalDisbursed').innerText = `৳ ${totalDis.toLocaleString('bn-BD')}`;
                document.getElementById('globalCollected').innerText = `৳ ${(totalDis - totalRem).toLocaleString('bn-BD')}`;
                document.getElementById('globalOutstanding').innerText = `৳ ${totalRem.toLocaleString('bn-BD')}`;
                document.getElementById('globalSavings').innerText = `৳ ${totalSav.toLocaleString('bn-BD')}`;

                loadBranchTable(loansSnap, usersSnap);

            } catch (e) { console.error(e); }
        }

        async function loadBranchTable(loansSnap, usersSnap) {
            const branchesSnap = await getDocs(collection(db, "branches"));
            const tbody = document.getElementById('branchPerformanceBody');
            tbody.innerHTML = "";

            branchesSnap.forEach(bDoc => {
                const bId = bDoc.id;
                const bData = bDoc.data();

                // ঐ শাখার লোন ক্যালকুলেশন
                let bRem = 0;
                loansSnap.forEach(l => {
                    if(l.data().branchId === bId) bRem += Number(l.data().remainingAmount || 0);
                });

                // ঐ শাখার সঞ্চয় ক্যালকুলেশন
                let bSav = 0;
                usersSnap.forEach(u => {
                    if(u.data().branchId === bId) bSav += Number(u.data().totalSavings || 0);
                });

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-5">
                            <p class="font-bold text-slate-800 text-sm">${bData.branchName}</p>
                            <p class="text-[10px] text-gray-400 italic">${bData.location}</p>
                        </td>
                        <td class="p-5 font-black text-red-500 text-sm">৳ ${bRem.toLocaleString('bn-BD')}</td>
                        <td class="p-5 font-black text-emerald-600 text-sm">৳ ${bSav.toLocaleString('bn-BD')}</td>
                        <td class="p-5 text-center">
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-3 py-1 rounded-full uppercase">Active</span>
                        </td>
                    </tr>
                `;
            });
        }

        loadOwnerDashboard();
    </script>
</body>
</html>
