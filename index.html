<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - লগইন ও স্ক্যানার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0f7f4; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-md border-t-8 border-green-600 transition-all">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-black text-green-700 italic tracking-tighter">আপন</h1>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mt-2">ক্ষুদ্রঋণ ও সঞ্চয় ব্যবস্থাপনা</p>
        </div>

        <!-- কাস্টমারদের জন্য কিউআর স্ক্যানার সেকশন (লগইন ছাড়া) -->
        <div class="mb-8">
            <a href="qr-scanner.html" class="flex flex-col items-center justify-center gap-3 w-full bg-slate-800 text-white py-6 rounded-3xl font-black shadow-xl hover:bg-slate-900 transition transform active:scale-95 border-b-4 border-slate-950">
                <span class="text-4xl">📷</span>
                <div class="text-center">
                    <p class="text-lg leading-none">কার্ড স্ক্যান করুন</p>
                    <p class="text-[10px] text-slate-400 uppercase mt-1 tracking-widest">লগইন ছাড়াই তথ্য দেখুন</p>
                </div>
            </a>
        </div>

        <div class="relative flex items-center justify-center mb-8">
            <hr class="w-full border-gray-200">
            <span class="absolute bg-white px-4 text-[10px] text-gray-400 font-bold uppercase tracking-widest">অথবা স্টাফ লগইন</span>
        </div>

        <!-- স্টাফ লগইন ফরম -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-500 font-bold text-[10px] uppercase ml-1 mb-1">ইমেল এড্রেস</label>
                <input type="email" id="email" placeholder="আপনার ইমেল লিখুন" required 
                    class="w-full px-4 py-3 border-2 border-gray-100 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none bg-gray-50 focus:bg-white transition text-sm">
            </div>

            <div>
                <label class="block text-gray-500 font-bold text-[10px] uppercase ml-1 mb-1">পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="******" required 
                    class="w-full px-4 py-3 border-2 border-gray-100 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none bg-gray-50 focus:bg-white transition text-sm">
            </div>

            <button type="submit" id="loginBtn"
                class="w-full bg-green-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-green-100 hover:bg-green-700 transition duration-300 transform active:scale-95 uppercase tracking-widest text-xs">
                লগইন করুন
            </button>
        </form>

        <!-- এরর মেসেজ -->
        <div id="message" class="mt-4 text-center text-red-500 text-xs font-bold min-h-[20px]"></div>

        <div class="mt-8 text-center border-t pt-6">
            <p class="text-[9px] text-gray-400 font-bold uppercase leading-relaxed">
                পাসওয়ার্ড ভুলে গেলে বা কার্ড হারিয়ে ফেললে <br> আপনার শাখার ম্যানেজারের সাথে যোগাযোগ করুন।
            </p>
        </div>
    </div>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword } from './firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const msg = document.getElementById('message');
        const btn = document.getElementById('loginBtn');

        // ১. অটো-রিডাইরেক্ট চেক (লগইন থাকলে সরাসরি ড্যাশবোর্ডে পাঠাবে)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    redirectUser(userDoc.data().role);
                }
            }
        });

        // ২. লগইন ফাংশন
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.innerText = "যাচাই করা হচ্ছে...";
            btn.disabled = true;
            msg.innerText = "";

            try {
                const userCred = await signInWithEmailAndPassword(auth, email, password);
                const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
                
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    
                    localStorage.setItem('userRole', userData.role);
                    localStorage.setItem('branchId', userData.branchId);
                    localStorage.setItem('userName', userData.name);
                    localStorage.setItem('userUid', userCred.user.uid);

                    redirectUser(userData.role);
                } else {
                    msg.innerText = "ইউজার প্রোফাইল পাওয়া যায়নি!";
                    btn.innerText = "লগইন করুন";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                msg.innerText = "ইমেল বা পাসওয়ার্ড ভুল!";
                btn.innerText = "লগইন করুন";
                btn.disabled = false;
            }
        });

        function redirectUser(role) {
            if (role === 'owner') window.location.href = 'owner-dashboard.html';
            else if (role === 'manager') window.location.href = 'manager-dashboard.html';
            else if (role === 'officer') window.location.href = 'officer-dashboard.html';
            else if (role === 'customer') window.location.href = 'customer-dashboard.html';
        }
    </script>
</body>
</html>
