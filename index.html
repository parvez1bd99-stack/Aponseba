<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>লগইন - ক্ষুদ্র ঋণ ব্যবস্থাপনা</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
    input, select, textarea { font-size: 16px; } /* আইফোনে ফোকাস করলে জুম হওয়া বন্ধ */
    button, a.btn { touch-action: manipulation; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (max-width: 767px) {
      .rtable thead { display: none; }
      .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
      .rtable tr { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
      .rtable td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0 !important; text-align: right; }
      .rtable td::before { content: attr(data-label); color: #6b7280; font-size: 12px; text-align: left; flex-shrink: 0; }
      .rtable td.title { display: block; text-align: left; font-size: 17px; font-weight: 700; padding-bottom: 9px !important; margin-bottom: 4px; border-bottom: 1px dashed #e5e7eb; }
      .rtable td.title::before, .rtable td.act::before, .rtable td.full::before { display: none; }
      .rtable td.act { display: block; padding-top: 10px !important; }
      .rtable td.act > * { width: 100%; text-align: center; }
      .rtable td.full { display: block; text-align: center; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-[100dvh] flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8">
    <div class="text-center mb-7">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-black">
        ৳
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800">মাইক্রোফাইন্যান্স সিস্টেম</h1>
      <p class="text-sm text-gray-500 mt-1">লগইন করে আপনার প্যানেলে প্রবেশ করুন</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">ইমেইল অ্যাড্রেস</label>
        <input type="email" id="email" required placeholder="admin@example.com" autocomplete="username" inputmode="email" autocapitalize="none"
               class="w-full border border-gray-300 rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
               class="w-full border border-gray-300 rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div id="errorMsg" class="hidden text-sm text-rose-600 font-medium bg-rose-50 p-3 rounded-xl border border-rose-200"></div>

      <button type="submit" id="loginBtn"
              class="w-full bg-emerald-600 active:bg-emerald-800 hover:bg-emerald-700 text-white font-semibold text-base py-3.5 rounded-xl shadow-md transition duration-200 disabled:opacity-60">
        লগইন করুন
      </button>
    </form>
  </div>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, doc, getDoc } from "./firebase-config.js";

    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const loginBtn = document.getElementById("loginBtn");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.innerText = "যাচাই করা হচ্ছে...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // ইউজারের রোল ফায়ারবেস থেকে আনা
        const userDoc = await getDoc(doc(db, "users", uid));
        
        if (userDoc.exists()) {
          const userData = userDoc.data();
          localStorage.setItem('userUid', uid);
          localStorage.setItem('userRole', userData.role);
          localStorage.setItem('userName', userData.name || 'ব্যবহারকারী');
          localStorage.setItem('branchId', userData.branchId || 'main');

          // রোলের ভিত্তিতে সংশ্লিষ্ট পেজে নিয়ে যাওয়া
          if (userData.role === "owner") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "officer.html";
          }
        } else {
          // যদি users কালেকশনে এন্ট্রি না থাকে তবে ডিফল্ট ওনার ধরা হবে
          localStorage.setItem('userUid', uid);
          localStorage.setItem('userRole', 'owner');
          window.location.href = "admin.html";
        }
      } catch (err) {
        console.error(err);
        errorMsg.innerText = "ভুল ইমেইল অথবা পাসওয়ার্ড দেওয়া হয়েছে!";
        errorMsg.classList.remove("hidden");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "লগইন করুন";
      }
    });
  </script>
</body>
</html>
