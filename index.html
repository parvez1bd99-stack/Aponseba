<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>লগইন - আপন সেবা</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
    input, select, textarea { font-size: 16px; } /* আইফোনে ফোকাস করলে জুম হওয়া বন্ধ */
    button, a.btn { touch-action: manipulation; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @media (max-width: 767px) {
      .rtable thead { display: none; }
      .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
      .rtable tr { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
      .rtable td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0 !important; text-align: right; }
      .rtable td::before { content: attr(data-label); color: #6b7280; font-size: 12px; text-align: left; flex-shrink: 0; }
      .rtable td.title { display: block; text-align: left; font-size: 17px; font-weight: 700; padding-bottom: 9px !important; margin-bottom: 4px; border-bottom: 1px dashed #e5e7eb; }
      .rtable td.title::before, .rtable td.act::before, .rtable td.full::before { display: none; }
      .rtable td.act { display: block; padding-top: 10px !important; }
      .rtable td.act > * { width: 100%; text-align: center; }
      .rtable td.full { display: block; text-align: center; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-[100dvh] flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8">
    <div class="text-center mb-7">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-black">
        ৳
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800">আপন সেবা</h1>
      <p class="text-sm text-gray-500 mt-1">লগইন করে আপনার প্যানেলে প্রবেশ করুন</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">ইমেইল অ্যাড্রেস</label>
        <input type="email" id="email" required placeholder="admin@example.com" autocomplete="username" inputmode="email" autocapitalize="none"
               class="w-full border border-gray-300 rounded-xl px-3.5 py-3 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
                 class="w-full border border-gray-300 rounded-xl pl-3.5 pr-12 py-3 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          <button type="button" id="togglePass" aria-label="পাসওয়ার্ড দেখুন" aria-pressed="false"
                  class="absolute inset-y-0 right-0 w-12 flex items-center justify-center text-gray-500 active:text-emerald-600">
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeOff" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6 0 9.5 7 9.5 7a16 16 0 01-3.2 4.2M6.6 6.6A16 16 0 002.5 12S6 19 12 19c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <div id="errorMsg" class="hidden text-sm text-rose-600 font-medium bg-rose-50 p-3 rounded-xl border border-rose-200"></div>

      <button type="button" id="loginBtn"
              class="w-full bg-emerald-600 active:bg-emerald-800 hover:bg-emerald-700 text-white font-semibold text-base py-3.5 rounded-xl shadow-md transition duration-200 disabled:opacity-60">
        লগইন করুন
      </button>
    </form>
  </div>

  <script>
    (function () {
      const input = document.getElementById("password");
      const btn = document.getElementById("togglePass");
      const open = document.getElementById("eyeOpen");
      const off = document.getElementById("eyeOff");
      btn.addEventListener("click", function () {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        open.classList.toggle("hidden", show);
        off.classList.toggle("hidden", !show);
        btn.setAttribute("aria-pressed", show);
        btn.setAttribute("aria-label", show ? "পাসওয়ার্ড লুকান" : "পাসওয়ার্ড দেখুন");
        input.focus();
      });
    })();
  </script>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, doc, getDoc } from "./firebase-config.js";

    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const loginBtn = document.getElementById("loginBtn");

    // সেভ করা ডাটা সিলেক্ট করলে বা কীবোর্ডের Enter চাপলে অটো লগইন বন্ধ:
    // শুধু লগইন বাটনে আসল ট্যাপ/ক্লিক করলেই লগইন হবে
    loginForm.addEventListener("submit", (e) => e.preventDefault());

    let realTap = false;
    ["pointerdown", "touchstart", "mousedown"].forEach((ev) =>
      loginBtn.addEventListener(ev, () => { realTap = true; }, { passive: true })
    );
    loginBtn.addEventListener("keydown", (e) => {
      if (e.isTrusted && (e.key === "Enter" || e.key === " ")) realTap = true;
    });

    loginBtn.addEventListener("click", async (e) => {
      if (!e.isTrusted || !realTap) return; // কোড/ব্রাউজার থেকে আসা অটো ক্লিক উপেক্ষা
      realTap = false;
      if (!loginForm.reportValidity()) return;
      errorMsg.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.innerText = "যাচাই করা হচ্ছে...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // ইউজারের রোল ফায়ারবেস থেকে আনা
        const userDoc = await getDoc(doc(db, "users", uid));
        
        if (userDoc.exists()) {
          const userData = userDoc.data();
          localStorage.setItem('userUid', uid);
          localStorage.setItem('userRole', userData.role);
          localStorage.setItem('userName', userData.name || 'ব্যবহারকারী');
          localStorage.setItem('branchId', userData.branchId || 'main');

          // রোলের ভিত্তিতে সংশ্লিষ্ট পেজে নিয়ে যাওয়া
          if (userData.role === "owner") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "officer.html";
          }
        } else {
          // যদি users কালেকশনে এন্ট্রি না থাকে তবে ডিফল্ট ওনার ধরা হবে
          localStorage.setItem('userUid', uid);
          localStorage.setItem('userRole', 'owner');
          window.location.href = "admin.html";
        }
      } catch (err) {
        console.error(err);
        errorMsg.innerText = "ভুল ইমেইল অথবা পাসওয়ার্ড দেওয়া হয়েছে!";
        errorMsg.classList.remove("hidden");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "লগইন করুন";
      }
    });
  </script>
</body>
</html>
