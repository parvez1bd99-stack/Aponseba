<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - স্মার্ট কার্ড প্রিন্টার প্রো (ক্লিন ভিউ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; margin: 0; }
        
        @media print {
            @page { size: A4; margin: 0; }
            .no-print { display: none !important; }
            body { background-color: white; }
            #printArea { 
                display: grid !important; 
                grid-template-columns: repeat(2, 92mm); 
                grid-auto-rows: 48mm; 
                gap: 5mm 3mm; 
                padding: 10mm 5mm;
                width: 210mm;
                justify-content: center;
            }
            .id-card { 
                break-inside: avoid; 
                border: 0.2pt solid #ccc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        .id-card { 
            width: 92mm; 
            height: 48mm; 
            background: #ffffff;
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .card-header { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
            height: 10mm;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fbbf24;
        }

        .card-body { 
            display: flex;
            height: 32mm; 
            padding: 10px 12px; /* প্যাডিং সামান্য বাড়ানো হয়েছে ভারসাম্য বজায় রাখতে */
            box-sizing: border-box;
            gap: 12px;
            background: #fff;
        }

        .info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
        .qr-col { width: 22mm; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* লাইন গ্যাপ এবং হাইট বাড়ানো হয়েছে */
        .info-item { margin-bottom: 5px; } /* প্রতিটি ব্লকের মাঝে ৫ পিক্সেল গ্যাপ */
        .label { font-size: 7px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 1px; line-height: 1; }
        .value { font-size: 11px; color: #000; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .value-id { font-size: 9.5px; font-family: monospace; font-weight: 900; color: #1e1b4b; letter-spacing: -0.1px; }

        .qr-wrap { width: 62px; height: 62px; background: white; padding: 2px; border: 1px solid #f1f5f9; border-radius: 4px; overflow: hidden; }
        .qr-wrap canvas, .qr-wrap img { width: 58px !important; height: 58px !important; }

        .verified-badge { font-size: 7px; color: #0d9488; font-weight: 900; border: 0.8px solid #0d9488; padding: 0 4px; border-radius: 2px; margin-top: 4px; }

        .card-footer { 
            background: #f8fafc;
            height: 6mm;
            border-top: 1px solid #f1f5f9;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-line { height: 3px; background: #fbbf24; width: 100%; }

        #printArea { display: none; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-5xl mx-auto no-print">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-indigo-950 p-6 rounded-3xl shadow-xl text-white">
            <div>
                <h1 class="text-2xl font-black italic uppercase">আপন <span class="text-amber-400">Card Center</span></h1>
                <p class="text-xs text-indigo-300 font-bold uppercase tracking-wider">Line Spacing Optimized for HD Print</p>
            </div>
            <div class="flex gap-2">
                <a href="manager-dashboard.html" class="bg-indigo-800 px-5 py-2 rounded-xl font-bold text-xs border border-indigo-700">ফিরে যান</a>
                <button onclick="prepareAndPrint()" class="bg-amber-400 text-indigo-950 px-8 py-2 rounded-xl font-black uppercase text-xs">প্রিন্ট শুরু 🖨️</button>
            </div>
        </div>

        <!-- মেম্বার লিস্ট -->
        <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
            <div class="p-4 border-b bg-slate-50">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="সদস্য খুঁজুন..." class="w-full bg-white border-2 border-gray-100 p-3 rounded-xl text-sm shadow-inner outline-indigo-500">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-white text-[10px] font-black uppercase text-slate-400 border-b">
                        <tr>
                            <th class="p-5 text-center w-16"><input type="checkbox" id="masterCheck" onclick="toggleAll(this)"></th>
                            <th class="p-5">সদস্যের নাম</th>
                            <th class="p-5">এনআইডি নম্বর</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody" class="text-sm">
                        <tr><td colspan="3" class="p-10 text-center italic text-gray-400">ডাটা লোড হচ্ছে...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- প্রিন্ট এরিয়া -->
    <div id="printArea"></div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('manager');
        const branchId = localStorage.getItem('branchId');
        const SECRET_KEY = "APON-SECURE-V1";
        let allMembers = [];

        async function loadMembers() {
            const tbody = document.getElementById('memberTableBody');
            const q = query(collection(db, "users"), where("branchId", "==", branchId), where("role", "==", "customer"));
            const snap = await getDocs(q);
            tbody.innerHTML = "";
            snap.forEach(d => {
                const u = d.data();
                allMembers.push({ id: d.id, ...u });
                tbody.innerHTML += `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition member-row">
                        <td class="p-5 text-center"><input type="checkbox" class="card-check w-5 h-5" value="${d.id}"></td>
                        <td class="p-5 font-bold text-slate-800">${u.name}</td>
                        <td class="p-5 font-mono text-slate-400">${u.nid || 'N/A'}</td>
                    </tr>
                `;
            });
        }

        window.toggleAll = (source) => {
            document.querySelectorAll('.card-check').forEach(cb => cb.checked = source.checked);
        };

        window.filterTable = () => {
            const input = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.member-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
            });
        };

        window.prepareAndPrint = async () => {
            const selectedIds = Array.from(document.querySelectorAll('.card-check:checked')).map(cb => cb.value);
            if(selectedIds.length === 0) return alert("মেম্বার বাছাই করুন!");

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = "";

            selectedIds.forEach(memberId => {
                const member = allMembers.find(m => m.id === memberId);
                const lockedData = btoa(SECRET_KEY + ":" + memberId);

                const cardHtml = `
                    <div class="id-card">
                        <div class="card-header">
                            <span style="font-size:11px; font-weight:900; text-transform:uppercase; font-style:italic;">আপন ক্ষুদ্রঋণ</span>
                            <span style="font-size:8px; font-weight:800; text-transform:uppercase;">Digital ID</span>
                        </div>
                        <div class="card-body">
                            <div class="info-col">
                                <div class="info-item">
                                    <p class="label">সদস্যের নাম</p>
                                    <p class="value">${member.name}</p>
                                </div>
                                <div class="info-item">
                                    <p class="label">সদস্য আইডি</p>
                                    <p class="value value-id uppercase">${memberId.substring(0, 12)}</p>
                                </div>
                                <div class="info-item">
                                    <p class="label">এনআইডি নম্বর</p>
                                    <p class="value value-id">${member.nid || '-----------'}</p>
                                </div>
                                <div class="info-item">
                                    <p class="label">স্থায়ী ঠিকানা</p>
                                    <p class="value" style="font-size:8px; italic; font-weight:500; color:#64748b;">${member.address || 'তথ্য নেই'}</p>
                                </div>
                            </div>
                            <div class="qr-col">
                                <div class="qr-wrap"><div id="qr-${memberId}"></div></div>
                                <div class="verified-badge">VERIFIED</div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span style="font-size:6px; color:#94a3b8; font-weight:bold; text-transform:uppercase;">Identity Card</span>
                            <div style="border-top:0.6px solid #94a3b8; width:45px; text-align:center; font-size:4px; color:#94a3b8; padding-top:2px;">AUTH SIGN</div>
                        </div>
                        <div class="footer-line"></div>
                    </div>
                `;
                printArea.insertAdjacentHTML('beforeend', cardHtml);

                new QRCode(document.getElementById(`qr-${memberId}`), {
                    text: lockedData, width: 128, height: 128, colorDark : "#1e1b4b"
                });
            });

            setTimeout(() => { window.print(); }, 1200);
        };

        loadMembers();
    </script>
</body>
</html>
