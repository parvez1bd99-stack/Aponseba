<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - ডিপিএস মনিটরিং প্যানেল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .audit-card { border-left: 6px solid #4f46e5; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-indigo-900 text-white p-5 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter uppercase">ডিপিএস অডিট ও মনিটরিং</h1>
                <p class="text-[10px] uppercase font-bold text-indigo-300 mt-0.5">শাখার সকল ডিপিএস লেনদেন</p>
            </div>
            <button onclick="history.back()" class="bg-indigo-800 p-2 rounded-xl border border-indigo-700">ফিরে যান</button>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8 max-w-6xl">
        
        <!-- ১. কেন্দ্রীয় ডিপিএস স্ট্যাটাস -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-indigo-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মোট ডিপিএস একাউন্ট</p>
                <h3 id="statTotalAccounts" class="text-2xl font-black text-slate-800 mt-1">০ টি</h3>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-indigo-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">মোট সংগৃহীত ডিপিএস</p>
                <h3 id="statTotalDeposited" class="text-2xl font-black text-indigo-600 mt-1">৳ ০</h3>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-indigo-100">
                <p class="text-[10px] font-bold text-gray-400 uppercase">আজকের আদায় (DPS)</p>
                <h3 id="statTodayCollection" class="text-2xl font-black text-green-600 mt-1">৳ ০</h3>
            </div>
            <div class="bg-slate-900 p-5 rounded-3xl shadow-lg text-white">
                <p class="text-[10px] font-bold uppercase text-indigo-400">উত্তোলন/ফেরত</p>
                <h3 id="statTotalWithdraw" class="text-2xl font-black mt-1 text-rose-400">৳ ০</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- ২. অফিসার ভিত্তিক আজকের আদায় (দুর্নীতি ধরার জন্য) -->
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                    <h3 class="font-black text-slate-700 uppercase text-xs tracking-widest">অফিসার ভিত্তিক আদায় (আজ)</h3>
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Cash tracking</span>
                </div>
                <div id="officerDpsList" class="p-4 space-y-3">
                    <!-- জাভাস্ক্রিপ্ট দিয়ে আসবে -->
                    <p class="text-center py-10 text-gray-400 italic">ডাটা লোড হচ্ছে...</p>
                </div>
            </div>

            <!-- ৩. সাম্প্রতিক ডিপিএস লেনদেনসমূহ -->
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                    <h3 class="font-black text-slate-700 uppercase text-xs tracking-widest">সাম্প্রতিক ডিপিএস লেনদেন</h3>
                    <button onclick="loadDpsMonitor()" class="text-indigo-600 font-bold text-xs">রিফ্রেশ</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <tbody id="recentDpsTransactions" class="text-xs divide-y divide-gray-50">
                            <!-- ডাটা আসবে -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('manager');
        const branchId = localStorage.getItem('branchId');

        async function loadDpsMonitor() {
            try {
                // ১. ডিপিএস একাউন্ট সামারি
                const dpsSnap = await getDocs(query(collection(db, "dps_accounts"), where("branchId", "==", branchId)));
                document.getElementById('statTotalAccounts').innerText = dpsSnap.size + " টি";
                
                let totalDep = 0;
                dpsSnap.forEach(d => totalDep += Number(d.data().totalDeposited || 0));
                document.getElementById('statTotalDeposited').innerText = "৳ " + totalDep.toLocaleString('bn-BD');

                // ২. আজকের লেনদেন এবং অফিসার ট্র্যাকিং
                const today = new Date(); today.setHours(0,0,0,0);
                const transSnap = await getDocs(query(collection(db, "transactions"), where("branchId", "==", branchId)));
                
                let todayDpsTotal = 0;
                let totalWithdraw = 0;
                const officerCollection = {}; // অফিসারদের ক্যাশ হিসাব রাখার জন্য

                const recentTransHtml = [];
                const allTrans = [];
                transSnap.forEach(d => allTrans.push(d.data()));
                
                // সর্ট করা (নতুন আগে)
                allTrans.sort((a,b) => b.date.toDate() - a.date.toDate());

                allTrans.forEach(t => {
                    const isToday = t.date.toDate() >= today;
                    
                    if (t.type === "DPS Installment") {
                        if(isToday) {
                            todayDpsTotal += Number(t.amount || 0);
                            // অফিসার ভিত্তিক ডাটা যোগ
                            const offId = t.collectedBy || t.officerId;
                            officerCollection[offId] = (officerCollection[offId] || 0) + Number(t.amount);
                        }
                        recentTransHtml.push(t);
                    } else if (t.type === "DPS Withdrawal") {
                        totalWithdraw += Number(t.amount || 0);
                    }
                });

                document.getElementById('statTodayCollection').innerText = "৳ " + todayDpsTotal.toLocaleString('bn-BD');
                document.getElementById('statTotalWithdraw').innerText = "৳ " + totalWithdraw.toLocaleString('bn-BD');

                // ৩. অফিসার লিস্ট রেন্ডার
                const offDiv = document.getElementById('officerDpsList');
                offDiv.innerHTML = "";
                
                // সব অফিসারের নাম আনা
                const offSnap = await getDocs(query(collection(db, "users"), where("branchId", "==", branchId), where("role", "==", "officer")));
                offSnap.forEach(oDoc => {
                    const off = oDoc.data();
                    const cash = officerCollection[oDoc.id] || 0;
                    offDiv.innerHTML += `
                        <div class="flex justify-between items-center p-4 bg-indigo-50 rounded-2xl border border-white">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-white text-indigo-600 rounded-full flex items-center justify-center font-bold shadow-sm">${off.name.charAt(0)}</div>
                                <div>
                                    <p class="font-bold text-slate-800 text-sm">${off.name}</p>
                                    <p class="text-[9px] text-gray-400 font-bold uppercase">আজকের ডিপিএস ক্যাশ</p>
                                </div>
                            </div>
                            <p class="font-black text-indigo-600">৳ ${cash.toLocaleString('bn-BD')}</p>
                        </div>
                    `;
                });

                // ৪. লেনদেন টেবিল রেন্ডার
                const tbody = document.getElementById('recentDpsTransactions');
                tbody.innerHTML = recentTransHtml.slice(0, 10).map(t => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4">
                            <p class="font-bold text-slate-700">ID: ${t.customerId.substring(0,8).toUpperCase()}</p>
                            <p class="text-[9px] text-gray-400 font-bold uppercase">${t.date.toDate().toLocaleTimeString('bn-BD')}</p>
                        </td>
                        <td class="p-4 text-right">
                            <p class="font-black text-indigo-600 text-sm">৳ ${t.amount}</p>
                            <p class="text-[8px] text-gray-400 italic">By: ${t.officerName || 'N/A'}</p>
                        </td>
                    </tr>
                `).join('');

            } catch (err) { console.error(err); }
        }

        loadDpsMonitor();
    </script>
</body>
</html>
