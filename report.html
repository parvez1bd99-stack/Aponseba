<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>আদায় রিপোর্ট</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
    input { font-size: 16px !important; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <header class="bg-emerald-700 text-white sticky top-0 z-40 shadow-sm" style="padding-top: env(safe-area-inset-top)">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
      <a id="backLink" href="officer.html" class="p-2 rounded-xl bg-emerald-800/80 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <div class="min-w-0">
        <h1 id="pageTitle" class="text-base font-bold leading-tight">আদায় রিপোর্ট</h1>
        <p id="pageSub" class="text-xs text-emerald-100 truncate">...</p>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-3.5 space-y-3">

    <!-- তারিখ নেভিগেশন -->
    <div class="bg-white rounded-2xl border border-slate-200 p-3 flex items-center gap-2">
      <button id="prevDay" class="shrink-0 w-10 h-10 rounded-xl bg-slate-100 active:bg-slate-200 font-bold text-lg">‹</button>
      <input type="date" id="datePicker" class="flex-1 min-w-0 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500 text-center font-semibold">
      <button id="nextDay" class="shrink-0 w-10 h-10 rounded-xl bg-slate-100 active:bg-slate-200 font-bold text-lg">›</button>
      <button id="todayBtn" class="shrink-0 px-3 h-10 rounded-xl bg-emerald-100 text-emerald-700 font-bold text-sm active:bg-emerald-200">আজ</button>
    </div>

    <p id="dayName" class="text-center text-sm font-bold text-slate-600"></p>

    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-center">
        <p class="text-[11px] font-semibold text-emerald-700">কিস্তি আদায়</p>
        <p id="sumInstallment" class="text-lg font-bold text-emerald-700">০ ৳</p>
      </div>
      <div class="bg-teal-50 border border-teal-200 rounded-2xl p-3 text-center">
        <p class="text-[11px] font-semibold text-teal-700">সঞ্চয় জমা</p>
        <p id="sumSavings" class="text-lg font-bold text-teal-700">০ ৳</p>
      </div>
      <div class="bg-slate-800 rounded-2xl p-3 text-center">
        <p class="text-[11px] font-semibold text-slate-300">মোট হাতে (কিস্তি + সঞ্চয়)</p>
        <p id="sumTotal" class="text-lg font-bold text-white">০ ৳</p>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl p-3 text-center">
        <p class="text-[11px] font-semibold text-slate-500">কতজনের কাছ থেকে</p>
        <p id="sumCount" class="text-lg font-bold text-slate-800">০ জন</p>
      </div>
    </div>

    <!-- অফিসারের জন্য: মালিক বুঝে নিয়েছেন কিনা -->
    <div id="officerHandover" class="hidden"></div>

    <div id="listBox" class="space-y-2.5">
      <p class="text-center text-sm text-slate-400 py-6">লোড হচ্ছে...</p>
    </div>
  </main>

  <script type="module">
    import { db, checkAccess, collection, query, where, onSnapshot, doc, runTransaction, setDoc } from "./firebase-config.js";

    checkAccess();

    // ---------- হেল্পার ----------
    const bn = (n) => Number(n || 0).toLocaleString('bn-BD');
    const round2 = (n) => Math.round(Number(n) * 100) / 100;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const localDateStr = (d = new Date()) =>
      d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const timeStr = (d) => d.toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });

    function shiftDate(dateStr, delta) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return localDateStr(new Date(y, m - 1, d + delta));
    }

    // ---------- স্টেট ----------
    const datePicker = document.getElementById('datePicker');
    datePicker.value = localDateStr();

    let role = null, myUid = null, myName = '';
    let rows = [];            // সেই দিনের সব আদায় (বাতিলসহ)
    let handovers = {};       // officerUid -> handover ডাটা
    let groups = {};          // owner view: officerUid -> গ্রুপ
    let unsubs = [];
    let dupMap = {};          // loanId -> আজ কতবার নেওয়া হয়েছে (বাতিল বাদে)

    function instText(r) {
      if (!r.instFrom) return '';
      return r.instFrom === r.instTo ? `কিস্তি নং ${bn(r.instFrom)}` : `কিস্তি নং ${bn(r.instFrom)}–${bn(r.instTo)}`;
    }

    function start() {
      role = localStorage.getItem('userRole');
      myUid = localStorage.getItem('userUid');
      myName = localStorage.getItem('userName') || '';
      if (!role || !myUid) { setTimeout(start, 300); return; }

      const isOwner = role === 'owner';
      document.getElementById('backLink').href = isOwner ? 'admin.html' : 'officer.html';
      document.getElementById('pageTitle').innerText = isOwner ? 'অফিসার ভিত্তিক আদায়' : 'আমার আদায়';
      document.getElementById('pageSub').innerText = isOwner ? 'সব অফিসারের হিসাব ও টাকা বুঝে নেওয়া' : myName;

      datePicker.addEventListener('change', () => load(datePicker.value));
      document.getElementById('prevDay').addEventListener('click', () => { datePicker.value = shiftDate(datePicker.value, -1); load(datePicker.value); });
      document.getElementById('nextDay').addEventListener('click', () => { datePicker.value = shiftDate(datePicker.value, 1); load(datePicker.value); });
      document.getElementById('todayBtn').addEventListener('click', () => { datePicker.value = localDateStr(); load(datePicker.value); });
      load(datePicker.value);
    }

    function showError(msg) {
      document.getElementById('listBox').innerHTML =
        '<p class="text-center text-sm text-rose-600 py-6">ডাটা আনতে সমস্যা: ' + esc(msg) + '</p>';
    }

    function load(dateStr) {
      unsubs.forEach(u => u());
      unsubs = [];
      rows = [];
      handovers = {};
      if (!dateStr) return;
      {
        const [yy, mm, dd] = dateStr.split('-').map(Number);
        document.getElementById('dayName').innerText = new Date(yy, mm - 1, dd).toLocaleDateString('bn-BD', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }

      const isOwner = role === 'owner';
      const startDay = new Date(dateStr + 'T00:00:00');
      const endDay = new Date(dateStr + 'T23:59:59.999');

      const colQ = isOwner
        ? query(collection(db, 'collections'), where('timestamp', '>=', startDay), where('timestamp', '<=', endDay))
        : query(collection(db, 'collections'), where('collectedByUid', '==', myUid));

      unsubs.push(onSnapshot(colQ, (snap) => {
        rows = [];
        snap.forEach(d => {
          const x = d.data();
          const ts = x.timestamp ? x.timestamp.toDate() : new Date();
          if (ts >= startDay && ts <= endDay) rows.push({ id: d.id, ...x, ts });
        });
        rows.sort((a, b) => b.ts - a.ts);
        render();
      }, (err) => showError(err.message)));

      if (isOwner) {
        unsubs.push(onSnapshot(query(collection(db, 'handovers'), where('dateKey', '==', dateStr)), (snap) => {
          handovers = {};
          snap.forEach(d => { const h = d.data(); handovers[h.officerUid] = h; });
          render();
        }, (err) => console.error('handover', err)));
      } else {
        unsubs.push(onSnapshot(doc(db, 'handovers', dateStr + '_' + myUid), (snap) => {
          handovers = snap.exists() ? { [myUid]: snap.data() } : {};
          render();
        }, (err) => console.error('handover', err)));
      }
    }

    function rowHtml(r, canCancel) {
      const cancelled = !!r.cancelled;
      return `
        <div class="flex items-center justify-between gap-3 py-2.5 border-b border-slate-100 last:border-0 ${cancelled ? 'opacity-60' : ''}">
          <div class="min-w-0">
            <p class="text-sm font-semibold text-slate-800 truncate ${cancelled ? 'line-through' : ''}">${esc(r.customerName)}</p>
            <p class="text-[11px] text-slate-500 truncate">${timeStr(r.ts)}${r.customerPhone ? ' • ' + esc(r.customerPhone) : ''}</p>
            <div class="flex flex-wrap gap-1 mt-0.5">
              ${instText(r) ? `<span class="text-[10px] font-bold bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded-md">${instText(r)}</span>` : ''}
              ${Number(r.advanceCount) > 0 ? `<span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-md">অগ্রিম ${bn(r.advanceCount)} টি</span>` : ''}
              ${!cancelled && dupMap[r.loanId] > 1 ? `<span class="text-[10px] font-bold bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded-md">আজ ${bn(dupMap[r.loanId])} বার নেওয়া</span>` : ''}
              ${r.balanceAfter !== undefined ? `<span class="text-[10px] text-slate-500 px-1">বাকি ${bn(r.balanceAfter)} ৳</span>` : ''}
            </div>
            ${cancelled ? `<p class="text-[11px] text-rose-600 font-semibold">বাতিল${r.cancelReason ? ': ' + esc(r.cancelReason) : ''}</p>` : ''}
          </div>
          <div class="text-right shrink-0">
            <p class="text-sm font-bold text-emerald-700 ${cancelled ? 'line-through' : ''}">${bn(r.amount)} ৳</p>
            ${Number(r.savingsAmount) > 0 ? `<p class="text-[11px] text-teal-600 ${cancelled ? 'line-through' : ''}">সঞ্চয় ${bn(r.savingsAmount)} ৳</p>` : ''}
            ${canCancel && !cancelled ? `<button onclick="cancelCollection('${esc(r.id)}')" class="mt-1 text-[11px] font-bold text-rose-600 bg-rose-50 active:bg-rose-100 px-2 py-1 rounded-lg">বাতিল</button>` : ''}
          </div>
        </div>`;
    }

    function handoverBadge(h, expected) {
      if (!h) return `<span class="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">বুঝে নেওয়া বাকি</span>`;
      const diff = round2(Number(h.received) - expected);
      if (Number(h.expected) !== expected) return `<span class="text-[10px] font-bold bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">হিসাব বদলেছে</span>`;
      if (diff === 0) return `<span class="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">বুঝে নেওয়া ✓</span>`;
      return `<span class="text-[10px] font-bold bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">${diff < 0 ? 'ঘাটতি ' + bn(-diff) : 'বেশি ' + bn(diff)} ৳</span>`;
    }

    function handoverPanel(uid, g, h) {
      let status = '';
      if (h) {
        const diff = round2(Number(h.received) - g.total);
        const stale = Number(h.expected) !== g.total;
        status = `
          <div class="rounded-xl p-2.5 text-xs ${stale ? 'bg-orange-50 border border-orange-200 text-orange-800' : (diff === 0 ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800')}">
            <p class="font-bold">বুঝে নেওয়া হয়েছে: ${bn(h.received)} ৳ ${h.note ? '• ' + esc(h.note) : ''}</p>
            <p>${stale ? `⚠️ বুঝে নেওয়ার পর হিসাব বদলেছে (তখন ${bn(h.expected)} ৳ ছিল, এখন ${bn(g.total)} ৳)। আবার মিলিয়ে সংরক্ষণ করুন।`
                        : (diff === 0 ? 'হিসাব পুরো মিলেছে।' : (diff < 0 ? `ঘাটতি ${bn(-diff)} ৳` : `${bn(diff)} ৳ বেশি দিয়েছে`))}</p>
          </div>`;
      }
      return `
        <div class="mt-2 mb-1 space-y-2 bg-slate-50 border border-slate-200 rounded-xl p-3">
          <p class="text-xs font-bold text-slate-600">অফিসারের কাছ থেকে টাকা বুঝে নেওয়া</p>
          <p class="text-xs text-slate-500">খাতায় হিসাব: <b class="text-slate-800">${bn(g.total)} ৳</b> (কিস্তি ${bn(g.inst)} + সঞ্চয় ${bn(g.sav)})</p>
          ${status}
          <div class="flex gap-2">
            <input type="number" inputmode="numeric" min="0" id="recv-${esc(uid)}" value="${h ? Number(h.received) : g.total}" class="w-1/2 min-w-0 border rounded-xl px-3 py-2 font-bold outline-none focus:ring-2 focus:ring-emerald-500" placeholder="হাতে পেয়েছি">
            <input type="text" id="hnote-${esc(uid)}" value="${h && h.note ? esc(h.note) : ''}" class="w-1/2 min-w-0 border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="মন্তব্য (ঐচ্ছিক)">
          </div>
          <button onclick="saveHandover('${esc(uid)}')" class="w-full bg-emerald-600 active:bg-emerald-800 text-white font-bold text-sm py-2.5 rounded-xl">${h ? 'সংশোধন করে সংরক্ষণ' : 'টাকা বুঝে নিলাম'}</button>
        </div>`;
    }

    function render() {
      const isOwner = role === 'owner';
      const valid = rows.filter(r => !r.cancelled);
      dupMap = {};
      valid.forEach(r => { if (r.loanId) dupMap[r.loanId] = (dupMap[r.loanId] || 0) + 1; });
      const inst = valid.reduce((s, r) => s + Number(r.amount || 0), 0);
      const sav = valid.reduce((s, r) => s + Number(r.savingsAmount || 0), 0);
      document.getElementById('sumInstallment').innerText = bn(inst) + ' ৳';
      document.getElementById('sumSavings').innerText = bn(sav) + ' ৳';
      document.getElementById('sumTotal').innerText = bn(inst + sav) + ' ৳';
      document.getElementById('sumCount').innerText = bn(valid.length) + ' জন';

      const box = document.getElementById('listBox');

      if (!isOwner) {
        // অফিসারের জন্য হ্যান্ডওভার অবস্থা
        const hb = document.getElementById('officerHandover');
        const h = handovers[myUid];
        hb.classList.remove('hidden');
        if (valid.length === 0 && !h) { hb.classList.add('hidden'); }
        else if (h) {
          const diff = round2(Number(h.received) - (inst + sav));
          hb.className = 'rounded-2xl p-3 text-sm border ' + (diff === 0 && Number(h.expected) === inst + sav ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-orange-50 border-orange-200 text-orange-800');
          hb.innerHTML = `<p class="font-bold">✓ মালিক ${bn(h.received)} ৳ বুঝে নিয়েছেন</p>` +
            (Number(h.expected) !== inst + sav ? '<p class="text-xs">তারপর হিসাবে পরিবর্তন হয়েছে, মালিকের সাথে মিলিয়ে নিন।</p>'
              : (diff === 0 ? '<p class="text-xs">হিসাব পুরো মিলেছে।</p>' : `<p class="text-xs">${diff < 0 ? 'ঘাটতি ' + bn(-diff) + ' ৳' : bn(diff) + ' ৳ বেশি'}</p>`));
        } else {
          hb.className = 'rounded-2xl p-3 text-sm border bg-amber-50 border-amber-200 text-amber-800';
          hb.innerHTML = `<p class="font-bold">⏳ মালিক এখনো টাকা বুঝে নেননি</p><p class="text-xs">${bn(inst + sav)} ৳ মালিককে জমা দিন।</p>`;
        }

        if (rows.length === 0) {
          box.innerHTML = '<p class="text-center text-sm text-slate-400 py-8">এই তারিখে কোনো আদায় নেই</p>';
          return;
        }
        box.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 px-4 py-1">${rows.map(r => rowHtml(r, false)).join('')}</div>`;
        return;
      }

      // ---- মালিকের ভিউ: অফিসার অনুযায়ী গ্রুপ ----
      document.getElementById('officerHandover').classList.add('hidden');

      // খোলা/টাইপ করা অবস্থা ধরে রাখা
      const openSet = new Set([...box.querySelectorAll('details[open]')].map(x => x.dataset.uid));
      const typed = {};
      box.querySelectorAll('input[id^="recv-"], input[id^="hnote-"]').forEach(inp => {
        if (document.activeElement === inp) typed[inp.id] = inp.value;
      });
      const focusedId = document.activeElement && document.activeElement.id;

      groups = {};
      rows.forEach(r => {
        const key = r.collectedByUid || 'unknown';
        if (!groups[key]) groups[key] = { name: r.collectedByName || 'অজানা', list: [], inst: 0, sav: 0, count: 0, total: 0, adv: 0, dup: 0 };
        groups[key].list.push(r);
        if (!r.cancelled) {
          groups[key].inst += Number(r.amount || 0);
          groups[key].sav += Number(r.savingsAmount || 0);
          groups[key].count++;
          if (Number(r.advanceCount) > 0) groups[key].adv++;
          if (dupMap[r.loanId] > 1) groups[key].dup++;
        }
      });
      Object.values(groups).forEach(g => { g.total = round2(g.inst + g.sav); });

      const list = Object.entries(groups).sort((a, b) => b[1].total - a[1].total);
      if (list.length === 0) {
        box.innerHTML = '<p class="text-center text-sm text-slate-400 py-8">এই তারিখে কোনো আদায় নেই</p>';
        return;
      }

      box.innerHTML = list.map(([uid, g]) => `
        <details data-uid="${esc(uid)}" class="bg-white rounded-2xl border border-slate-200 overflow-hidden" ${openSet.has(uid) ? 'open' : ''}>
          <summary class="p-4 flex items-center justify-between gap-3 cursor-pointer">
            <div class="min-w-0">
              <p class="font-bold text-slate-800 truncate">${esc(g.name)}</p>
              <p class="text-[11px] text-slate-500">${bn(g.count)} জন • কিস্তি ${bn(g.inst)} ৳ + সঞ্চয় ${bn(g.sav)} ৳</p>
              <div class="mt-1 flex flex-wrap gap-1">${handoverBadge(handovers[uid], g.total)}
                ${g.adv > 0 ? `<span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">অগ্রিম ${bn(g.adv)} জন</span>` : ''}
                ${g.dup > 0 ? `<span class="text-[10px] font-bold bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">একাধিকবার ${bn(g.dup)} এন্ট্রি</span>` : ''}
              </div>
            </div>
            <div class="text-right shrink-0">
              <p class="text-base font-bold text-emerald-700">${bn(g.total)} ৳</p>
              <p class="text-[10px] text-slate-400">ট্যাপ করে খুলুন</p>
            </div>
          </summary>
          <div class="px-4 pb-3 border-t border-slate-100">
            ${handoverPanel(uid, g, handovers[uid])}
            ${g.list.map(r => rowHtml(r, true)).join('')}
          </div>
        </details>`).join('');

      // টাইপ করা মান ফিরিয়ে দেওয়া
      Object.entries(typed).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
      if (focusedId) { const el = document.getElementById(focusedId); if (el) el.focus(); }
    }

    // ---------- আদায় বাতিল (শুধু মালিক) ----------
    window.cancelCollection = async (id) => {
      if (role !== 'owner') return;
      const reason = prompt('বাতিলের কারণ লিখুন (যেমন: ভুল টাকা লেখা হয়েছে):');
      if (reason === null) return;
      if (!reason.trim()) { alert('কারণ লিখতে হবে।'); return; }
      if (!confirm('এই আদায়টি বাতিল করলে গ্রাহকের বাকি, সঞ্চয় ও পরের কিস্তির তারিখ আগের অবস্থায় ফিরে যাবে। নিশ্চিত?')) return;

      try {
        await runTransaction(db, async (t) => {
          const cRef = doc(db, 'collections', id);
          const cDoc = await t.get(cRef);
          if (!cDoc.exists()) throw new Error('রেকর্ড পাওয়া যায়নি।');
          const c = cDoc.data();
          if (c.cancelled) throw new Error('এটি আগেই বাতিল হয়েছে।');
          if (c.prevStatus === undefined) throw new Error('এটি পুরোনো রেকর্ড (নতুন সিস্টেমের আগের), সরাসরি বাতিল করা যাবে না।');

          const lRef = doc(db, 'loans', c.loanId);
          const lDoc = await t.get(lRef);
          if (!lDoc.exists()) throw new Error('লোন পাওয়া যায়নি।');
          const l = lDoc.data();
          if (l.savingsRefunded) throw new Error('এই গ্রাহকের সঞ্চয় ফেরত দেওয়া হয়ে গেছে, তাই বাতিল করা যাবে না।');
          if ((l.lastCollectionId || '') !== id) throw new Error('এই গ্রাহকের এর পরে আরও আদায় হয়েছে। আগে নতুনগুলো বাতিল করুন (নতুন থেকে পুরোনো ক্রমে)।');

          t.update(lRef, {
            paidAmount: round2(Number(l.paidAmount || 0) - Number(c.amount || 0)),
            remainingAmount: round2(Number(l.remainingAmount || 0) + Number(c.amount || 0)),
            savingsBalance: Math.max(0, round2(Number(l.savingsBalance || 0) - Number(c.savingsAmount || 0))),
            status: c.prevStatus,
            nextDueDate: c.prevNextDueDate || '',
            partialCredit: Number(c.prevPartialCredit || 0),
            lastCollectionId: c.prevLastCollectionId || '',
            ...(c.prevInstallmentsDone !== undefined ? { installmentsDone: Number(c.prevInstallmentsDone) } : {})
          });
          t.update(cRef, { cancelled: true, cancelledAt: new Date(), cancelledBy: myUid, cancelReason: reason.trim() });
          t.update(doc(db, 'loans', c.loanId, 'history', id), { cancelled: true });
        });
        alert('আদায়টি বাতিল হয়েছে।');
      } catch (err) {
        alert('বাতিল করা যায়নি: ' + (err && err.message ? err.message : err));
      }
    };

    // ---------- টাকা বুঝে নেওয়া (শুধু মালিক) ----------
    window.saveHandover = async (officerUid) => {
      if (role !== 'owner') return;
      const g = groups[officerUid];
      if (!g) return;
      const dateKey = datePicker.value;
      const received = Number(document.getElementById('recv-' + officerUid).value);
      const note = document.getElementById('hnote-' + officerUid).value.trim();
      if (!Number.isFinite(received) || received < 0) { alert('সঠিক টাকার পরিমাণ লিখুন।'); return; }

      const diff = round2(received - g.total);
      const msg = `${g.name} এর কাছ থেকে ${received} ৳ বুঝে নিচ্ছেন।\nখাতায় হিসাব: ${g.total} ৳\n` +
        (diff === 0 ? 'হিসাব মিলেছে।' : (diff < 0 ? `ঘাটতি: ${-diff} ৳` : `বেশি: ${diff} ৳`)) + '\n\nসংরক্ষণ করবেন?';
      if (!confirm(msg)) return;

      try {
        await setDoc(doc(db, 'handovers', dateKey + '_' + officerUid), {
          dateKey,
          officerUid,
          officerName: g.name,
          expected: g.total,
          received,
          difference: diff,
          note,
          receivedAt: new Date(),
          receivedBy: myUid
        });
      } catch (err) {
        alert('সংরক্ষণ করা যায়নি: ' + (err && err.message ? err.message : err));
      }
    };

    start();
  </script>
</body>
</html>
