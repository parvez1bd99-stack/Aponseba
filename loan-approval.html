<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - লোন অনুমোদন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-indigo-900 p-5 rounded-2xl shadow-lg text-white">
            <div>
                <h1 class="text-xl font-black uppercase tracking-tight">লোন অনুমোদন প্যানেল</h1>
                <p class="text-[10px] opacity-70 uppercase font-bold">পেন্ডিং আবেদনসমূহ যাচাই করুন</p>
            </div>
            <a href="manager-dashboard.html" class="text-xs bg-indigo-700 px-4 py-2 rounded-xl font-bold hover:bg-indigo-800 transition">ফিরে যান</a>
        </div>

        <!-- Pending List Area -->
        <div id="pendingList" class="space-y-4">
            <div class="text-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                <p class="text-gray-400 text-sm italic">আবেদন লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('manager'); 
        const branchId = localStorage.getItem('branchId');

        async function loadPendingRequests() {
            const q = query(collection(db, "loan_requests"), where("branchId", "==", branchId), where("status", "==", "Pending"));
            const snap = await getDocs(q);
            const listArea = document.getElementById('pendingList');
            listArea.innerHTML = "";

            if(snap.empty) {
                listArea.innerHTML = `
                    <div class="bg-white p-10 rounded-3xl text-center shadow-sm border-2 border-dashed border-gray-200">
                        <span class="text-4xl">🎉</span>
                        <p class="text-gray-400 font-bold mt-2">বর্তমানে কোনো লোন আবেদন পেন্ডিং নেই।</p>
                    </div>`;
                return;
            }

            for(const appDoc of snap.docs) {
                const data = appDoc.data();
                const uSnap = await getDoc(doc(db, "users", data.customerId));
                const user = uSnap.data();

                const schemeText = data.loanScheme === 'Weekly' ? 'সাপ্তাহিক' : 'মাসিক';
                const timeText = data.loanScheme === 'Weekly' ? 
                                `কিস্তির দিন: ${data.collectionDay}` : 
                                `কিস্তির তারিখ: প্রতি মাসের ${data.collectionDate} তারিখ`;

                listArea.innerHTML += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 animate-fade-in relative overflow-hidden">
                        <!-- স্কিম ব্যাজ -->
                        <div class="absolute top-0 right-0 bg-indigo-600 text-white px-4 py-1 rounded-bl-xl text-[9px] font-black uppercase">
                            ${schemeText}
                        </div>

                        <div class="flex justify-between items-start mb-4 mt-2">
                            <div>
                                <h3 class="font-black text-gray-800 text-lg">${user.name}</h3>
                                <p class="text-[10px] text-indigo-600 font-bold uppercase tracking-widest">মোবাইল: ${user.phone}</p>
                                <p class="text-[10px] text-gray-400 mt-1 font-bold">অফিসার: ${data.officerName || 'N/A'}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xl font-black text-indigo-700">৳ ${data.totalAmount}</p>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">${data.totalInstallments} টি কিস্তি</p>
                            </div>
                        </div>

                        <!-- লোন গ্রহণের উদ্দেশ্য (Note) - নতুন যুক্ত হয়েছে -->
                        <div class="mb-4 p-3 bg-amber-50 border-l-4 border-amber-400 rounded-lg">
                            <p class="text-[9px] text-amber-600 font-black uppercase mb-1">লোন গ্রহণের উদ্দেশ্য:</p>
                            <p class="text-[12px] text-slate-700 font-bold italic">"${data.note || 'কোনো বিবরণ দেওয়া হয়নি'}"</p>
                        </div>

                        <div class="bg-indigo-50 p-4 rounded-2xl mb-4 grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px] font-bold">
                            <p class="text-gray-500 italic">${timeText}</p>
                            <p class="text-gray-500 italic md:text-right">প্রতি কিস্তি: <span class="text-indigo-700">৳ ${data.perInstallment}</span></p>
                        </div>
                        
                        <div class="flex gap-3">
                            <button onclick="approveLoan('${appDoc.id}')" class="flex-1 bg-green-600 text-white py-3 rounded-2xl text-xs font-black shadow-lg shadow-green-100 hover:bg-green-700 transition active:scale-95">অনুমোদন করুন</button>
                            <button onclick="rejectLoan('${appDoc.id}')" class="px-6 bg-red-50 text-red-600 py-3 rounded-2xl text-xs font-bold hover:bg-red-100 transition active:scale-95">বাতিল</button>
                        </div>
                    </div>
                `;
            }
        }

        window.approveLoan = async (requestId) => {
            if(!confirm("আপনি কি নিশ্চিত যে এই লোনটি অনুমোদন করতে চান?")) return;

            try {
                const reqRef = doc(db, "loan_requests", requestId);
                const reqSnap = await getDoc(reqRef);
                const data = reqSnap.data();

                const batch = writeBatch(db);
                const newLoanRef = doc(collection(db, "loans"));
                
                const loanObject = {
                    customerId: data.customerId,
                    branchId: data.branchId,
                    officerId: data.officerId,
                    officerName: data.officerName,
                    totalAmount: data.totalAmount,
                    perInstallment: data.perInstallment,
                    totalInstallments: data.totalInstallments,
                    loanScheme: data.loanScheme,
                    note: data.note || "", // উদ্দেশ্যটিও মূল লোন একাউন্টে সেভ হবে
                    paidInstallments: 0,
                    remainingAmount: data.totalAmount,
                    status: "Active",
                    disbursedDate: serverTimestamp()
                };

                if(data.loanScheme === 'Weekly') {
                    loanObject.collectionDay = data.collectionDay;
                } else {
                    loanObject.collectionDate = data.collectionDate;
                }

                batch.set(newLoanRef, loanObject);
                const userRef = doc(db, "users", data.customerId);
                batch.update(userRef, { loanActive: true });
                batch.delete(reqRef);

                await batch.commit();
                alert("সফল! লোন অনুমোদিত হয়েছে।");
                loadPendingRequests();

            } catch (e) { 
                alert("ত্রুটি: " + e.message); 
            }
        };

        window.rejectLoan = async (requestId) => {
            if(!confirm("আপনি কি এই আবেদনটি বাতিল করতে চান?")) return;
            try {
                const reqRef = doc(db, "loan_requests", requestId);
                const batch = writeBatch(db);
                batch.delete(reqRef);
                await batch.commit();
                loadPendingRequests();
            } catch (e) { alert(e.message); }
        };

        window.loadPendingRequests = loadPendingRequests;
        loadPendingRequests();
    </script>
</body>
</html>
