<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - অফিসার মনিটরিং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
        .progress-bg { background: #e2e8f0; height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 1s ease-in-out; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-indigo-900 text-white p-5 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black uppercase tracking-tight italic">অফিসার মনিটরিং</h1>
                <p class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest">Branch Performance Center</p>
            </div>
            <a href="manager-dashboard.html" class="bg-indigo-700 p-2 rounded-xl hover:bg-indigo-600 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8 max-w-5xl">
        <!-- আজকের সারসংক্ষেপ -->
        <div class="bg-white p-6 rounded-3xl shadow-sm mb-8 border border-indigo-50 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-lg font-black text-slate-800 tracking-tight">শাখার অফিসারবৃন্দ</h2>
                <p id="todayDisplay" class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1"></p>
            </div>
            <div class="flex gap-2">
                <div class="bg-indigo-50 px-4 py-2 rounded-2xl border border-indigo-100 text-center">
                    <p class="text-[8px] text-indigo-400 font-black uppercase">মোট অফিসার</p>
                    <span id="officerCount" class="text-indigo-700 font-black text-sm">০ জন</span>
                </div>
                <button onclick="loadBranchOfficers()" class="bg-indigo-600 text-white px-4 py-2 rounded-2xl text-xs font-black shadow-lg">রিফ্রেশ</button>
            </div>
        </div>

        <!-- অফিসার গ্রিড -->
        <div id="officerGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                <p class="text-gray-400 text-xs font-bold uppercase italic">অফিসারদের পারফরম্যান্স চেক করা হচ্ছে...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('manager'); 
        const branchId = localStorage.getItem('branchId');

        async function loadBranchOfficers() {
            const grid = document.getElementById('officerGrid');
            const countText = document.getElementById('officerCount');
            
            const now = new Date();
            const daysInEnglish = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayDayName = daysInEnglish[now.getDay()];
            const todayDateNum = now.getDate();

            document.getElementById('todayDisplay').innerText = "আজকের কাজ: " + now.toLocaleDateString('bn-BD', {day:'numeric', month:'long', year:'numeric'});

            try {
                // ১. অফিসার লিস্ট
                const qOff = query(collection(db, "users"), where("branchId", "==", branchId), where("role", "==", "officer"));
                const offSnap = await getDocs(qOff);
                
                // ২. শাখার সব লোন (টার্গেট বের করার জন্য)
                const qLoans = query(collection(db, "loans"), where("branchId", "==", branchId), where("status", "==", "Active"));
                const loanSnap = await getDocs(qLoans);
                const allActiveLoans = loanSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));

                // ৩. আজকের লেনদেন (আদায় বের করার জন্য)
                const todayStart = new Date(); todayStart.setHours(0,0,0,0);
                const qTrans = query(collection(db, "transactions"), where("branchId", "==", branchId));
                const transSnap = await getDocs(qTrans);
                const branchTransactions = transSnap.docs.map(doc => doc.data());

                grid.innerHTML = "";
                countText.innerText = offSnap.size + " জন";

                if(offSnap.empty) {
                    grid.innerHTML = '<div class="col-span-full text-center p-10 bg-white rounded-3xl border-dashed border-2 text-gray-400 font-bold uppercase">শাখায় কোনো অফিসার নেই</div>';
                    return;
                }

                offSnap.forEach(oDoc => {
                    const off = oDoc.data();
                    const offUid = oDoc.id;

                    // অফিসারের আজকের টার্গেট ক্যালকুলেশন
                    let todayTarget = 0;
                    let targetCount = 0;
                    let finishedCount = 0;

                    const myLoans = allActiveLoans.filter(l => l.officerId === offUid);
                    myLoans.forEach(loan => {
                        let isOnDuty = false;
                        const scheme = loan.loanScheme || 'Weekly';
                        if(scheme === 'Weekly' && loan.collectionDay === todayDayName) isOnDuty = true;
                        else if(scheme === 'Monthly' && Number(loan.collectionDate) === todayDateNum) isOnDuty = true;

                        if(isOnDuty) {
                            todayTarget += Number(loan.perInstallment || 0);
                            targetCount++;
                            // চেক করা আজ এই মেম্বার কিস্তি দিয়েছে কি না
                            const paid = branchTransactions.some(t => t.loanId === loan.id && t.date.toDate() >= todayStart && t.type === "Loan Payment");
                            if(paid) finishedCount++;
                        }
                    });

                    // অফিসারের আজকের মোট আদায় (Loan + Savings)
                    const todayColl = branchTransactions.filter(t => {
                        return t.collectedBy === offUid && t.date.toDate() >= todayStart;
                    }).reduce((sum, t) => sum + Number(t.amount || 0), 0);

                    // প্রগ্রেস পার্সেন্টেজ
                    const progress = targetCount > 0 ? Math.round((finishedCount / targetCount) * 100) : 0;

                    grid.innerHTML += `
                        <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-white flex flex-col">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl border border-indigo-100 font-black shadow-inner">
                                    ${off.name.charAt(0)}
                                </div>
                                <div>
                                    <h3 class="font-black text-slate-800 text-lg leading-none">${off.name}</h3>
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="text-[9px] bg-slate-100 text-slate-500 font-bold px-2 py-0.5 rounded-full uppercase">Code: ${off.officerCode || 'N/A'}</span>
                                        <a href="tel:${off.phone}" class="text-[9px] text-indigo-500 font-bold uppercase">📞 ফোন</a>
                                    </div>
                                </div>
                            </div>

                            <!-- প্রগ্রেস সেকশন -->
                            <div class="mb-6">
                                <div class="flex justify-between text-[10px] font-black uppercase mb-2">
                                    <span class="text-gray-400">আজকের কাজের প্রগ্রেস</span>
                                    <span class="${progress === 100 ? 'text-green-600' : 'text-indigo-600'}">${progress}% সম্পন্ন</span>
                                </div>
                                <div class="progress-bg">
                                    <div class="progress-fill ${progress === 100 ? 'bg-green-500' : 'bg-indigo-600'}" style="width: ${progress}%"></div>
                                </div>
                            </div>

                            <div class="bg-slate-50 p-5 rounded-3xl grid grid-cols-2 gap-4 mb-6 border border-gray-100">
                                <div class="border-r border-gray-200">
                                    <p class="text-[9px] text-gray-400 font-black uppercase mb-1">টার্গেট ডিউটি</p>
                                    <p class="text-sm font-black text-slate-700">${targetCount} জন (৳${todayTarget.toLocaleString('bn-BD')})</p>
                                </div>
                                <div>
                                    <p class="text-[9px] text-gray-400 font-black uppercase mb-1">আজকের মোট আদায়</p>
                                    <p class="text-sm font-black text-green-600">৳ ${todayColl.toLocaleString('bn-BD')}</p>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button onclick="monitorOfficer('${offUid}', '${off.name}')" class="flex-1 bg-indigo-600 text-white py-3.5 rounded-2xl font-black text-[11px] uppercase shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition active:scale-95">বিস্তারিত মনিটর</button>
                                <a href="tel:${off.phone}" class="bg-slate-100 p-3.5 rounded-2xl text-indigo-600 border border-indigo-50">📱</a>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 font-bold p-10 uppercase">ডাটা লোড ব্যর্থ: ${err.message}</p>`;
            }
        }

        window.monitorOfficer = (uid, name) => {
            localStorage.setItem('monitor_off_uid', uid);
            localStorage.setItem('monitor_off_name', name);
            window.location.href = 'officer-tasks.html';
        };

        loadBranchOfficers();
    </script>
</body>
</html>
