<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - বকেয়া কিস্তি তালিকা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #fef2f2; }
        .defaulter-card { border-left: 8px solid #ef4444; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .defaulter-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="bg-red-700 text-white p-5 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter uppercase">বকেয়া লিস্ট</h1>
                <p class="text-[10px] uppercase font-bold text-red-200 mt-0.5 tracking-widest">কিস্তি মিস করা সদস্যদের তালিকা</p>
            </div>
            <button onclick="history.back()" class="bg-red-800 p-2 rounded-xl text-xs font-bold px-4 border border-red-600">ফিরে যান</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-2xl">
        
        <!-- বকেয়া সামারি রিপোর্ট -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-5 rounded-[2rem] border border-red-100 shadow-sm text-center">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">বকেয়া মেম্বার</p>
                <h3 id="totalDefaulters" class="text-3xl font-black text-red-600 mt-1">০</h3>
            </div>
            <div class="bg-white p-5 rounded-[2rem] border border-red-100 shadow-sm text-center">
                <p class="text-[9px] font-black text-gray-400 uppercase tracking-tighter">মোট বকেয়া অংক</p>
                <h3 id="totalDueAmount" class="text-2xl font-black text-slate-800 mt-1">৳ ০</h3>
            </div>
        </div>

        <div class="mb-4 px-2 flex justify-between items-center">
            <h3 class="text-sm font-black text-slate-700 uppercase tracking-widest">বকেয়া প্রোফাইলসমূহ</h3>
            <span class="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold uppercase">Action Required</span>
        </div>

        <!-- ডিফল্টার লিস্ট এরিয়া -->
        <div id="defaulterList" class="space-y-5">
            <div class="text-center py-20">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-600 mx-auto mb-4"></div>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">বকেয়া হিসাব করা হচ্ছে...</p>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('officer'); 
        const officerUid = localStorage.getItem('userUid');

        async function loadDefaulters() {
            if(!officerUid) return;

            const listArea = document.getElementById('defaulterList');
            let totalDefaulterCount = 0;
            let totalDueMoney = 0;

            try {
                // ১. অফিসারের সব সক্রিয় লোন ডাটা আনা
                const q = query(collection(db, "loans"), where("officerId", "==", officerUid), where("status", "==", "Active"));
                const loanSnap = await getDocs(q);
                
                let listHtml = "";
                const now = new Date();

                for (const lDoc of loanSnap.docs) {
                    const loan = lDoc.data();
                    const disbursedDate = loan.disbursedDate.toDate();
                    
                    // ২. সময়কাল অনুযায়ী কতগুলো কিস্তি দেওয়ার কথা (সাপ্তাহিক/মাসিক)
                    let totalShouldPay = 0;
                    const scheme = loan.loanScheme || 'Weekly';

                    if(scheme === 'Weekly') {
                        const diffWeeks = Math.floor((now - disbursedDate) / (1000 * 60 * 60 * 24 * 7));
                        totalShouldPay = diffWeeks + 1;
                    } else {
                        const diffMonths = (now.getFullYear() - disbursedDate.getFullYear()) * 12 + (now.getMonth() - disbursedDate.getMonth());
                        totalShouldPay = diffMonths + 1;
                    }

                    // ৩. বকেয়া কিস্তি সংখ্যা
                    const missedCount = totalShouldPay - loan.paidInstallments;

                    if (missedCount > 0) {
                        totalDefaulterCount++;
                        const dueAmount = missedCount * loan.perInstallment;
                        totalDueMoney += dueAmount;

                        const uSnap = await getDoc(doc(db, "users", loan.customerId));
                        const user = uSnap.data();

                        listHtml += `
                            <div class="defaulter-card bg-white p-6 rounded-[2.5rem] relative overflow-hidden">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="font-black text-slate-800 text-lg leading-none">${user.name}</h3>
                                        <p class="text-[10px] text-gray-400 font-bold mt-1 uppercase italic leading-none">স্বামী/স্ত্রী: ${user.partnerName || 'N/A'}</p>
                                    </div>
                                    <div class="text-right">
                                        <span class="bg-red-500 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase shadow-lg shadow-red-100">বকেয়া: ${missedCount} টি</span>
                                        <p class="text-[8px] text-gray-400 font-bold uppercase mt-1">স্কিম: ${scheme}</p>
                                    </div>
                                </div>

                                <div class="bg-slate-50 p-4 rounded-3xl mb-5 border border-gray-100">
                                    <div class="flex justify-between items-center">
                                        <div>
                                            <p class="text-[9px] text-gray-400 font-black uppercase">মোট বকেয়া অংক</p>
                                            <p class="text-2xl font-black text-red-600 tracking-tighter">৳ ${dueAmount.toLocaleString('bn-BD')}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-[9px] text-gray-400 font-black uppercase">নির্ধারিত কিস্তি</p>
                                            <p class="text-base font-black text-slate-700 italic">৳ ${loan.perInstallment.toLocaleString('bn-BD')}</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- বাটন গ্রুপ -->
                                <div class="grid grid-cols-12 gap-2">
                                    <!-- ১. লোন পরিশোধ / আদায় বাটন -->
                                    <a href="payment-collection.html?loanId=${lDoc.id}" class="col-span-8 bg-green-600 text-white py-4 rounded-2xl font-black text-xs shadow-lg shadow-green-100 flex items-center justify-center gap-2 uppercase tracking-widest active:scale-95 transition">
                                        <span>💸</span> কিস্তি আদায় করুন
                                    </a>
                                    
                                    <!-- ২. ফোন বাটন -->
                                    <a href="tel:${user.phone}" class="col-span-2 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center border border-red-100 active:scale-95 transition">
                                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg>
                                    </a>
                                    
                                    <!-- ৩. প্রোফাইল বাটন -->
                                    <button onclick="location.href='scan-view.html?id=${loan.customerId}'" class="col-span-2 bg-slate-100 text-slate-600 rounded-2xl flex items-center justify-center border border-slate-200 active:scale-95 transition">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                // সামারি আপডেট
                document.getElementById('totalDefaulters').innerText = totalDefaulterCount;
                document.getElementById('totalDueAmount').innerText = "৳ " + totalDueMoney.toLocaleString('bn-BD');
                
                listArea.innerHTML = listHtml || `<div class="bg-white p-12 rounded-[2.5rem] text-center border-2 border-dashed border-gray-200 text-gray-400 font-bold uppercase text-xs">সবাই নিয়মিত কিস্তি দিচ্ছে! 🎉</div>`;

            } catch (err) {
                console.error(err);
                listArea.innerHTML = `<div class="p-10 text-center text-red-500 font-bold uppercase text-xs">এরর: ${err.message}</div>`;
            }
        }

        loadDefaulters();
    </script>
</body>
</html>
