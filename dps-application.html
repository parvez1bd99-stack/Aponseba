<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - ডিপিএস আবেদন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .calc-card { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: #fff; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic">আপন | ডিপিএস শাখা</h1>
            <a href="officer-dashboard.html" class="text-xs bg-indigo-800 px-4 py-2 rounded-lg font-bold hover:bg-indigo-900 transition">ফিরে যান</a>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-xl">
        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border">
            <div class="bg-indigo-600 p-6 text-white text-center">
                <h2 class="text-2xl font-black uppercase tracking-tight">নতুন ডিপিএস ফরম</h2>
                <p class="text-[10px] opacity-80 uppercase tracking-widest mt-1 font-bold">আপনার নিজস্ব সদস্যদের জন্য একাউন্ট খুলুন</p>
            </div>

            <form id="dpsForm" class="p-6 md:p-8 space-y-6">
                
                <!-- সদস্য নির্বাচন (অফিসার ফিল্টার যুক্ত) -->
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">আপনার সংগৃহীত সদস্য</label>
                    <select id="memberSelect" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 bg-white text-sm font-bold" required>
                        <option value="">সদস্য লোড হচ্ছে...</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">কিস্তির পরিমাণ (৳)</label>
                        <input type="number" id="dpsAmount" oninput="calculate()" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 font-black text-indigo-700" placeholder="উদা: ৫০০" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">মেয়াদ (বছর)</label>
                        <select id="dpsDuration" onchange="calculate()" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 font-bold">
                            <option value="3">৩ বছর</option>
                            <option value="5">৫ বছর</option>
                            <option value="10" selected>১০ বছর</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">কিস্তির ধরণ (Scheme)</label>
                    <select id="dpsScheme" class="w-full border-2 border-gray-100 p-3 rounded-xl outline-indigo-500 font-bold">
                        <option value="Monthly">মাসিক (Monthly)</option>
                        <option value="Weekly">সাপ্তাহিক (Weekly)</option>
                    </select>
                </div>

                <!-- ম্যাচুরিটি হিসাব -->
                <div class="calc-card p-6 rounded-3xl shadow-lg">
                    <p class="text-[10px] uppercase font-bold text-indigo-300 mb-1">মোট জমার পরিমাণ (Maturity)</p>
                    <div class="flex justify-between items-end">
                        <h2 id="totalReturn" class="text-4xl font-black tracking-tighter">৳ ০</h2>
                        <span class="text-[10px] opacity-60 font-bold italic">* মুনাফা বাদে আসল</span>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition active:scale-95 uppercase tracking-widest text-sm">ডিপিএস একাউন্ট নিশ্চিত করুন</button>
            </form>
        </div>
    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // ১. অফিসার এক্সেস চেক
        checkAccess('officer'); 

        const branchId = localStorage.getItem('branchId');
        const officerUid = localStorage.getItem('userUid'); // অফিসারের ইউনিক আইডি
        const officerName = localStorage.getItem('userName');

        // ২. শুধুমাত্র এই অফিসারের আন্ডারে থাকা সদস্য লোড করা
        async function loadMyMembers() {
            if(!officerUid) return;

            const select = document.getElementById('memberSelect');
            try {
                // কুয়েরিতে officerId দিয়ে ফিল্টার করা হয়েছে
                const q = query(collection(db, "users"), 
                            where("officerId", "==", officerUid), 
                            where("role", "==", "customer"));
                
                const snap = await getDocs(q);
                select.innerHTML = '<option value="">সদস্য নির্বাচন করুন</option>';
                
                if(snap.empty) {
                    select.innerHTML = '<option value="">আপনার কোনো সদস্য নেই</option>';
                    return;
                }

                snap.forEach(d => {
                    const u = d.data();
                    select.innerHTML += `<option value="${d.id}">${u.name} (${u.phone})</option>`;
                });

            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="">ডাটা লোড ব্যর্থ!</option>';
            }
        }

        // ৩. ক্যালকুলেশন লজিক
        window.calculate = () => {
            const amount = parseFloat(document.getElementById('dpsAmount').value) || 0;
            const years = parseInt(document.getElementById('dpsDuration').value) || 0;
            const total = amount * 12 * years;
            document.getElementById('totalReturn').innerText = "৳ " + total.toLocaleString('bn-BD');
        };

        // ৪. ডিপিএস ডাটা সেভ
        document.getElementById('dpsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const memberId = document.getElementById('memberSelect').value;

            if(!memberId) return alert("সদস্য নির্বাচন করুন!");

            btn.disabled = true; 
            btn.innerText = "প্রসেসিং...";

            try {
                await addDoc(collection(db, "dps_accounts"), {
                    customerId: memberId,
                    branchId: branchId,
                    officerId: officerUid, // ডিপিএসটি এই অফিসারের আন্ডারে থাকবে
                    officerName: officerName,
                    installmentAmount: Number(document.getElementById('dpsAmount').value),
                    durationYears: Number(document.getElementById('dpsDuration').value),
                    scheme: document.getElementById('dpsScheme').value,
                    paidInstallments: 0,
                    totalDeposited: 0,
                    status: "Active",
                    createdAt: serverTimestamp()
                });

                alert("সফল! আপনার সদস্যের জন্য ডিপিএস একাউন্ট খোলা হয়েছে।");
                window.location.href = 'officer-dashboard.html';

            } catch (err) {
                alert("এরর: " + err.message);
                btn.disabled = false;
                btn.innerText = "ডিপিএস একাউন্ট নিশ্চিত করুন";
            }
        });

        loadMyMembers();
    </script>
</body>
</html>
