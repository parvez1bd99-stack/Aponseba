<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - সদস্য ভর্তি ফরম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .input-box { width: 100%; border: 2px solid #e5e7eb; padding: 12px; border-radius: 12px; outline: none; transition: 0.3s; font-size: 14px; font-weight: 600; }
        .input-box:focus { border-color: #0d9488; background-color: #fff; box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1); }
        .section-title { font-size: 11px; font-weight: 900; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; items-center: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    </style>
</head>
<body class="pb-10">

    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-black italic text-teal-100 uppercase tracking-tighter">আপন</h1>
                <span class="text-[10px] bg-teal-800 px-2 py-0.5 rounded font-bold uppercase border border-teal-600">নিবন্ধন</span>
            </div>
            <a href="officer-dashboard.html" class="text-xs bg-teal-800 px-4 py-2 rounded-lg font-bold hover:bg-teal-900 transition">ফিরে যান</a>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-xl">
        <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-teal-600 p-6 text-white text-center">
                <h2 class="text-2xl font-black uppercase tracking-tight">সদস্য ভর্তি ফরম</h2>
                <p class="text-[10px] opacity-80 uppercase tracking-widest mt-1 font-bold">স্বামী ও স্ত্রীর যৌথ তথ্য দিয়ে পূরণ করুন</p>
            </div>

            <form id="registrationForm" class="p-6 md:p-8 space-y-8">
                
                <!-- সেকশন ১: সদস্যের তথ্য -->
                <div>
                    <div class="section-title">সদস্যের তথ্য (প্রধান আবেদনকারী)</div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">পূর্ণ নাম</label>
                            <input type="text" id="mName" class="input-box bg-gray-50" placeholder="সদস্যের নাম লিখুন" required>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">মোবাইল নম্বর</label>
                                <input type="number" id="mPhone" class="input-box bg-gray-50" placeholder="০১XXXXXXXXX" required>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">এনআইডি নম্বর (NID)</label>
                                <input type="number" id="mNid" class="input-box bg-gray-50" placeholder="জাতীয় পরিচয়পত্র নম্বর" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- সেকশন ২: স্বামী/স্ত্রীর তথ্য -->
                <div>
                    <div class="section-title">স্বামী/স্ত্রীর তথ্য (দ্বিতীয় পক্ষ/জামিনদার)</div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">স্বামী বা স্ত্রীর নাম</label>
                            <input type="text" id="pName" class="input-box bg-gray-50" placeholder="নাম লিখুন" required>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">মোবাইল নম্বর</label>
                                <input type="number" id="pPhone" class="input-box bg-gray-50" placeholder="০১XXXXXXXXX" required>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">এনআইডি নম্বর (NID)</label>
                                <input type="number" id="pNid" class="input-box bg-gray-50" placeholder="জাতীয় পরিচয়পত্র নম্বর" required>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- সেকশন ৩: ঠিকানা ও সঞ্চয় -->
                <div>
                    <div class="section-title">স্থায়ী ঠিকানা ও সঞ্চয়</div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">বিস্তারিত ঠিকানা</label>
                            <textarea id="mAddress" rows="2" class="input-box bg-gray-50" placeholder="গ্রাম, ডাকঘর, থানা ও জেলা..." required></textarea>
                        </div>

                        <div class="bg-teal-50 p-6 rounded-3xl border border-teal-100 mt-4">
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-[11px] font-black text-teal-700 uppercase ml-1">প্রাথমিক সঞ্চয় জমা (৳)</label>
                                <span class="text-[9px] bg-teal-600 text-white px-2 py-0.5 rounded font-black uppercase">নগদ গ্রহণ</span>
                            </div>
                            <input type="number" id="mSavings" class="w-full border-none bg-transparent outline-none font-black text-4xl text-teal-700 p-0" placeholder="০" required>
                        </div>
                    </div>
                </div>

                <!-- সাবমিট বাটন -->
                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-teal-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-teal-100 hover:bg-teal-700 transition active:scale-95 uppercase tracking-widest text-sm py-4">সদস্য ভর্তি সম্পন্ন করুন</button>
                    <p id="msg" class="text-center text-xs font-bold mt-4"></p>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, serverTimestamp, writeBatch, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess('officer');
        
        const registrationForm = document.getElementById('registrationForm');

        registrationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            const branchId = localStorage.getItem('branchId');
            const officerUid = localStorage.getItem('userUid');
            const officerName = localStorage.getItem('userName');

            btn.disabled = true;
            btn.innerText = "প্রসেসিং হচ্ছে...";

            try {
                const batch = writeBatch(db);
                const newUserRef = doc(collection(db, "users"));
                const initialSavings = Number(document.getElementById('mSavings').value);

                // যৌথ তথ্যসহ ডাটা অবজেক্ট
                const userData = {
                    name: document.getElementById('mName').value,
                    phone: document.getElementById('mPhone').value,
                    nid: document.getElementById('mNid').value,
                    // পার্টনার/স্বামী-স্ত্রীর তথ্য
                    partnerName: document.getElementById('pName').value,
                    partnerPhone: document.getElementById('pPhone').value,
                    partnerNid: document.getElementById('pNid').value,
                    
                    address: document.getElementById('mAddress').value,
                    totalSavings: initialSavings,
                    branchId: branchId,
                    officerId: officerUid,
                    officerName: officerName,
                    role: "customer",
                    loanActive: false,
                    createdAt: serverTimestamp()
                };

                batch.set(newUserRef, userData);

                // ট্রানজ্যাকশন এন্ট্রি
                const transRef = doc(collection(db, "transactions"));
                batch.set(transRef, {
                    customerId: newUserRef.id,
                    amount: initialSavings,
                    type: "Savings Deposit",
                    branchId: branchId,
                    officerId: officerUid,
                    date: serverTimestamp(),
                    note: "ভর্তি সময়ের প্রাথমিক সঞ্চয়"
                });

                await batch.commit();

                alert("সফল! সদস্য ভর্তি হয়েছে।\nমেম্বার আইডি: " + newUserRef.id.substring(0,8).toUpperCase());
                window.location.href = 'officer-dashboard.html';

            } catch (err) {
                console.error(err);
                msg.innerText = "ত্রুটি: " + err.message;
                msg.style.color = "red";
                btn.disabled = false;
                btn.innerText = "সদস্য ভর্তি সম্পন্ন করুন";
            }
        });
    </script>
</body>
</html>
