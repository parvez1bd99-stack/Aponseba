<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - আদায় কেন্দ্র</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0fdf4; }
        .member-item:active { transform: scale(0.98); }
        .search-container { max-height: 400px; overflow-y: auto; }
        .input-focus:focus { border-color: #16a34a; box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-10">

    <!-- Header -->
    <header class="bg-green-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic uppercase tracking-tighter">আপন | আদায় কেন্দ্র</h1>
            <a href="officer-dashboard.html" class="text-xs bg-green-800 px-4 py-2 rounded-lg font-bold flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                ফিরে যান
            </a>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-xl">
        
        <!-- সদস্য খোঁজা সেকশন -->
        <div id="searchSection" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100 mb-6">
            <div class="bg-green-600 p-5 text-white text-center">
                <h2 class="text-lg font-black uppercase tracking-tight">সদস্য নির্বাচন করুন</h2>
                <p class="text-[10px] opacity-80 font-bold uppercase tracking-widest mt-1">সদস্য সার্চ করে কিস্তি আদায় করুন</p>
            </div>
            
            <div class="p-5">
                <div class="relative mb-4">
                    <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">🔍</span>
                    <input type="text" id="memberSearchInput" onkeyup="filterMembers()" placeholder="সদস্যের নাম বা ফোন..." 
                        class="w-full bg-slate-50 border-2 border-slate-50 p-4 pl-12 rounded-2xl outline-green-600 text-sm font-bold transition focus:bg-white">
                </div>

                <div id="loader" class="text-center py-10">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600 mx-auto"></div>
                    <p class="text-[10px] text-gray-400 mt-2 font-bold uppercase">লোড হচ্ছে...</p>
                </div>

                <div id="memberList" class="search-container space-y-2 hidden">
                    <!-- মেম্বার কার্ড আসবে -->
                </div>
            </div>
        </div>

        <!-- লোন ও সঞ্চয় আদায় ফরম -->
        <div id="paymentFormSection" class="hidden animate-fade-in">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-green-100">
                <div class="bg-slate-900 p-6 text-white text-center">
                    <div id="selectedMemberName" class="text-xl font-black">...</div>
                    <p id="selectedMemberInfo" class="text-[10px] text-green-400 font-bold uppercase mt-1">...</p>
                </div>

                <div class="p-6 space-y-6">
                    <!-- সদস্য লোন ও সঞ্চয় স্থিতি -->
                    <div class="bg-green-50 p-5 rounded-2xl border border-green-100 space-y-3 shadow-inner">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-500 italic font-bold">বাকি লোন:</span>
                            <span id="remLoanText" class="font-black text-red-600">৳ ০</span>
                        </div>
                        <div class="flex justify-between items-center text-sm border-t border-green-200 pt-2">
                            <span class="text-gray-500 italic font-bold">নির্ধারিত কিস্তি:</span>
                            <span id="fixedInstText" class="font-black text-green-700">৳ ০</span>
                        </div>
                        <div class="flex justify-between items-center text-sm border-t border-green-200 pt-2">
                            <span class="text-gray-500 italic font-bold">সাধারণ সঞ্চয়:</span>
                            <span id="totalSavText" class="font-black text-blue-600">৳ ০</span>
                        </div>
                    </div>

                    <form id="collectionForm" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div id="loanInputBox" class="hidden space-y-1">
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">কিস্তি আদায় (৳)</label>
                                <input type="number" id="loanPayAmt" class="w-full border-2 border-gray-100 p-4 rounded-2xl input-focus font-black text-green-700 text-xl bg-gray-50">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">সঞ্চয় জমা (৳)</label>
                                <input type="number" id="savPayAmt" class="w-full border-2 border-gray-100 p-4 rounded-2xl input-focus font-black text-blue-600 text-xl bg-gray-50">
                            </div>
                        </div>

                        <div id="closingNotice" class="hidden p-4 bg-orange-100 border-l-4 border-orange-500 rounded-xl text-[10px] text-orange-800 font-bold uppercase italic">
                            ⚠️ এই পেমেন্টে লোন সম্পূর্ণ পরিশোধ হয়ে যাবে।
                        </div>

                        <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black shadow-lg hover:bg-green-700 transition active:scale-95 uppercase tracking-widest text-sm">টাকা জমা নিশ্চিত করুন</button>
                        
                        <button type="button" onclick="resetSelection()" class="w-full text-center text-[10px] text-gray-400 font-black uppercase mt-2">ভুল সদস্য? অন্য মেম্বার খুঁজুন</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc, serverTimestamp, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        checkAccess(); 

        const branchId = localStorage.getItem('branchId');
        const userRole = localStorage.getItem('userRole');
        const userUid = localStorage.getItem('userUid');
        const userName = localStorage.getItem('userName');
        
        let allCustomers = [];
        let selectedCustomerId = null;
        let selectedLoanData = null;

        // ১. লোড ও অটো-সিলেক্ট লজিক
        async function init() {
            try {
                const q = (userRole === 'officer') 
                    ? query(collection(db, "users"), where("officerId", "==", userUid), where("role", "==", "customer"))
                    : query(collection(db, "users"), where("branchId", "==", branchId), where("role", "==", "customer"));

                const snap = await getDocs(q);
                allCustomers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('memberList').classList.remove('hidden');
                renderList(allCustomers);

                const urlParams = new URLSearchParams(window.location.search);
                const autoLoanId = urlParams.get('loanId');
                const autoCustId = urlParams.get('id');

                if(autoLoanId) {
                    const lSnap = await getDoc(doc(db, "loans", autoLoanId));
                    if(lSnap.exists()) selectCustomer(lSnap.data().customerId);
                } else if(autoCustId) {
                    selectCustomer(autoCustId);
                }

            } catch (err) { console.error(err); }
        }

        function renderList(data) {
            const listDiv = document.getElementById('memberList');
            listDiv.innerHTML = data.map(u => `
                <div onclick="selectCustomer('${u.id}')" class="member-item p-4 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:bg-green-50 transition flex justify-between items-center mb-2 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center font-black text-white shadow-sm">${u.name.charAt(0)}</div>
                        <div>
                            <p class="font-black text-slate-800">${u.name}</p>
                            <p class="text-[10px] text-gray-400 font-bold uppercase italic">${u.phone}</p>
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-400 font-black uppercase">সিলেক্ট করুন ➡️</p>
                </div>
            `).join('');
        }

        window.filterMembers = () => {
            const input = document.getElementById('memberSearchInput').value.toLowerCase();
            const filtered = allCustomers.filter(u => u.name.toLowerCase().includes(input) || u.phone.includes(input));
            renderList(filtered);
        };

        window.selectCustomer = async (uid) => {
            selectedCustomerId = uid;
            let user = allCustomers.find(u => u.id === uid);
            if(!user) {
                const uSnap = await getDoc(doc(db, "users", uid));
                if(!uSnap.exists()) return alert("সদস্য পাওয়া যায়নি!");
                user = uSnap.data();
            }

            document.getElementById('selectedMemberName').innerText = user.name;
            document.getElementById('selectedMemberInfo').innerText = `ID: ${uid.substring(0,10).toUpperCase()} | ${user.phone}`;
            document.getElementById('totalSavText').innerText = "৳ " + (user.totalSavings || 0).toLocaleString('bn-BD');

            const lq = query(collection(db, "loans"), where("customerId", "==", uid), where("status", "==", "Active"));
            const lSnap = await getDocs(lq);
            if(!lSnap.empty) {
                selectedLoanData = { id: lSnap.docs[0].id, ...lSnap.docs[0].data() };
                document.getElementById('loanInputBox').classList.remove('hidden');
                document.getElementById('remLoanText').innerText = "৳ " + selectedLoanData.remainingAmount.toLocaleString('bn-BD');
                document.getElementById('fixedInstText').innerText = "৳ " + selectedLoanData.perInstallment.toLocaleString('bn-BD');
                document.getElementById('loanPayAmt').value = selectedLoanData.perInstallment;
            } else {
                selectedLoanData = null;
                document.getElementById('loanInputBox').classList.add('hidden');
                document.getElementById('remLoanText').innerText = "কোনো সক্রিয় লোন নেই";
                document.getElementById('fixedInstText').innerText = "৳ ০";
            }

            document.getElementById('searchSection').classList.add('hidden');
            document.getElementById('paymentFormSection').classList.remove('hidden');
            window.scrollTo(0, 0);
        };

        window.resetSelection = () => {
            document.getElementById('paymentFormSection').classList.add('hidden');
            document.getElementById('searchSection').classList.remove('hidden');
            selectedLoanData = null;
        };

        document.getElementById('collectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loanPay = Number(document.getElementById('loanPayAmt').value) || 0;
            const savPay = Number(document.getElementById('savPayAmt').value) || 0;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true; btn.innerText = "সেভ হচ্ছে...";

            try {
                const batch = writeBatch(db);
                const userRef = doc(db, "users", selectedCustomerId);

                if(loanPay > 0 && selectedLoanData) {
                    const newRem = selectedLoanData.remainingAmount - loanPay;
                    batch.update(doc(db, "loans", selectedLoanData.id), { 
                        remainingAmount: increment(-loanPay), 
                        paidInstallments: increment(1),
                        status: newRem <= 0 ? "Paid" : "Active"
                    });
                    if(newRem <= 0) batch.update(userRef, { loanActive: false });
                    batch.set(doc(collection(db, "transactions")), {
                        customerId: selectedCustomerId, loanId: selectedLoanData.id, amount: loanPay, 
                        type: "Loan Payment", branchId: branchId, officerId: userUid, date: serverTimestamp()
                    });
                }

                if(savPay > 0) {
                    batch.update(userRef, { totalSavings: increment(savPay) });
                    batch.set(doc(collection(db, "transactions")), {
                        customerId: selectedCustomerId, amount: savPay, 
                        type: "Savings Deposit", branchId: branchId, officerId: userUid, date: serverTimestamp()
                    });
                }

                await batch.commit();
                alert("সফল! টাকা জমা নেওয়া হয়েছে।");
                location.reload();

            } catch (err) { alert(err.message); btn.disabled = false; }
        });

        init();
    </script>
</body>
</html>
