<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপন - শাখা খরচ ব্যবস্থাপনা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #fff1f2; }</style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-red-800 border-l-4 border-red-600 pl-3 uppercase">শাখা খরচ এন্ট্রি</h1>
            <button onclick="history.back()" class="text-xs bg-white text-red-600 px-4 py-2 rounded-xl font-bold shadow-sm border border-red-100">ফিরে যান</button>
        </div>

        <div class="grid grid-cols-1 gap-8">
            <!-- খরচ এন্ট্রি ফরম -->
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-red-50">
                <div class="bg-red-600 p-5 text-white text-center">
                    <p class="text-[10px] uppercase font-bold tracking-widest opacity-80">Daily Expense Tracking</p>
                </div>

                <form id="expenseForm" class="p-6 md:p-8 space-y-5">
                    <!-- খরচের ধরণ -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">খরচের ধরণ (Category)</label>
                        <select id="expCategory" class="w-full border-2 border-gray-100 p-3 rounded-2xl outline-red-500 bg-gray-50 focus:bg-white transition text-sm font-bold" required>
                            <option value="Conveyance">যাতায়াত খরচ (Conveyance)</option>
                            <option value="Refreshment">আপ্যায়ন/নাস্তা (Refreshment)</option>
                            <option value="Stationery">স্টেশনারি/কাগজ-কলম (Stationery)</option>
                            <option value="Utility Bills">বিদ্যুৎ/মোবাইল বিল (Utility)</option>
                            <option value="Office Rent">অফিস ভাড়া (Rent)</option>
                            <option value="Others">অন্যান্য (Others)</option>
                        </select>
                    </div>

                    <!-- টাকার পরিমাণ -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">টাকার পরিমাণ (৳)</label>
                        <input type="number" id="expAmount" class="w-full border-2 border-gray-100 p-4 rounded-2xl outline-red-600 font-black text-2xl text-red-600 bg-gray-50 focus:bg-white transition" placeholder="০.০০" required>
                    </div>

                    <!-- নোট বা বিবরণ -->
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">খরচের সংক্ষিপ্ত বিবরণ</label>
                        <textarea id="expNote" rows="2" class="w-full border-2 border-gray-100 p-3 rounded-2xl outline-red-500 text-sm bg-gray-50 focus:bg-white transition" placeholder="কেন এই খরচ করা হলো..."></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-red-100 hover:bg-red-700 transition active:scale-95 uppercase tracking-widest text-sm py-4">খরচ সেভ করুন</button>
                </form>
            </div>

            <!-- আজকের খরচ তালিকা -->
            <div class="bg-white rounded-3xl shadow-lg border border-red-50 overflow-hidden">
                <div class="p-5 border-b bg-red-50 flex justify-between items-center">
                    <h3 class="text-sm font-black text-red-800 uppercase tracking-tight">আজকের খরচের তালিকা</h3>
                    <span id="todayTotal" class="bg-red-600 text-white px-3 py-1 rounded-full text-[10px] font-black">৳ ০</span>
                </div>
                <div class="overflow-x-auto">
                    <div id="expenseList" class="p-4 space-y-3">
                        <p class="text-center text-gray-400 text-xs italic py-10">ডাটা লোড হচ্ছে...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, checkAccess } from './firebase-config.js';
        import { collection, addDoc, query, where, getDocs, serverTimestamp, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // স্টাফ এক্সেস চেক
        checkAccess(); 

        const branchId = localStorage.getItem('branchId');
        const userName = localStorage.getItem('userName');

        // খরচ সেভ করার লজিক
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "সেভ হচ্ছে...";

            try {
                await addDoc(collection(db, "expenses"), {
                    branchId: branchId,
                    category: document.getElementById('expCategory').value,
                    amount: Number(document.getElementById('expAmount').value),
                    note: document.getElementById('expNote').value,
                    date: serverTimestamp(),
                    addedBy: userName
                });

                alert("খরচ সফলভাবে রেকর্ড করা হয়েছে!");
                location.reload();

            } catch (err) {
                alert("ত্রুটি: " + err.message);
                btn.disabled = false;
                btn.innerText = "খরচ সেভ করুন";
            }
        });

        // আজকের খরচ লোড করা
        async function loadTodayExpenses() {
            const listDiv = document.getElementById('expenseList');
            const totalSpan = document.getElementById('todayTotal');
            
            try {
                const today = new Date();
                today.setHours(0,0,0,0);

                const q = query(collection(db, "expenses"), 
                            where("branchId", "==", branchId), 
                            where("date", ">=", Timestamp.fromDate(today)),
                            orderBy("date", "desc"));

                const snap = await getDocs(q);
                listDiv.innerHTML = "";
                let total = 0;

                if(snap.empty) {
                    listDiv.innerHTML = '<p class="text-center text-gray-400 text-xs py-10 italic font-bold">আজকের কোনো খরচ নেই।</p>';
                    return;
                }

                snap.forEach(d => {
                    const data = d.data();
                    total += data.amount;
                    listDiv.innerHTML += `
                        <div class="flex justify-between items-center p-4 bg-red-50 rounded-2xl border border-white shadow-sm">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-xl bg-white text-red-600 flex items-center justify-center text-sm shadow-sm">💸</div>
                                <div>
                                    <p class="font-bold text-slate-800 text-sm">${data.category}</p>
                                    <p class="text-[9px] text-gray-500 font-bold uppercase">${data.note || 'বিবরণ নেই'}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-red-600">৳ ${data.amount}</p>
                                <p class="text-[8px] text-gray-400 italic">By: ${data.addedBy}</p>
                            </div>
                        </div>
                    `;
                });

                totalSpan.innerText = "৳ " + total.toLocaleString('bn-BD');

            } catch (err) {
                console.error(err);
                listDiv.innerHTML = '<p class="text-center text-red-500 text-xs py-10 uppercase font-black">ইন্ডেক্স এরর! ফায়ারবেস কনসোলে ইন্ডেক্স তৈরি করুন।</p>';
            }
        }

        loadTodayExpenses();
    </script>
</body>
</html>
